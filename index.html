<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Owl Nihongo: belajar bahasa Jepang dari nol sampai bisnis. Kaiwa bersuara, soal dan tryout JFT A2, game interaktif, dan progres harian.">
<meta name="theme-color" content="#B5462F">
<meta property="og:title" content="Owl Nihongo">
<meta property="og:description" content="Belajar bahasa Jepang dari nol sampai bisnis.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Owl Nihongo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Owl Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sidebar kiri (desktop) / tab bawah (HP); konten satu kolom, kartu dipakai hanya untuk objek yang bisa disentuh. */
:root{
  --bg:#FBF5EC; --surface:#FFFDF8; --surface-2:#F4EADB; --line:#E7D8C4;
  --ink:#3B2A20; --ink-2:#6E5848; --ink-3:#9A8370;
  --maple:#B5462F; --maple-ink:#FFF6EF; --maple-soft:#F6E0D6;
  --amber:#D9802F; --amber-soft:#FBE8D1; --gold:#B98A2E;
  --good:#3E7D4F; --good-soft:#DFEFE1; --bad:#B5462F; --bad-soft:#F6DDD5;
  --shadow:0 1px 2px rgba(59,42,32,.06),0 6px 20px rgba(59,42,32,.07);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --rt:.6em; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1713; --surface:#271F19; --surface-2:#32281F; --line:#46382D;
  --ink:#F3E8DA; --ink-2:#C9B39D; --ink-3:#94806D;
  --maple:#E2735B; --maple-ink:#2A130D; --maple-soft:#4A2A21;
  --amber:#EFA15A; --amber-soft:#463121; --gold:#DDB462;
  --good:#7CC08E; --good-soft:#233629; --bad:#EE8A75; --bad-soft:#4A2821;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1713; --surface:#271F19; --surface-2:#32281F; --line:#46382D;
  --ink:#F3E8DA; --ink-2:#C9B39D; --ink-3:#94806D;
  --maple:#E2735B; --maple-ink:#2A130D; --maple-soft:#4A2A21;
  --amber:#EFA15A; --amber-soft:#463121; --gold:#DDB462;
  --good:#7CC08E; --good-soft:#233629; --bad:#EE8A75; --bad-soft:#4A2821;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--maple);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:.01em}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
ruby{ruby-position:over}
rt{font-size:var(--rt);color:var(--ink-2);font-weight:500;letter-spacing:0;font-family:var(--f-body)}
.nofuri rt{display:none}
.notr .tr{display:none}
.jp{font-family:var(--f-body);font-size:1.28rem;line-height:2.25;font-weight:500}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:38px;height:38px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{font-size:.7rem;color:var(--ink-3);letter-spacing:.14em}
.chip-stat svg{width:15px;height:15px;color:var(--amber);flex:none}
.chip-stat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--ink-3);font-size:.7rem;font-weight:700}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--maple)}
.tabs a .jpn{font-size:.62rem;font-weight:500;opacity:.8}
@media (min-width:900px){
  .app{grid-template-columns:252px 1fr}
  .top,.tabs{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:700}
  .side nav a svg{width:20px;height:20px}
  .side nav a .jpn{margin-left:auto;font-size:.72rem;font-weight:500;color:var(--ink-3)}
  .side nav a:hover{background:var(--surface-2)}
  .side nav a.on{background:var(--maple-soft);color:var(--maple)}
  .main{padding-block:32px 48px}
}
.side .goal{margin-top:auto;padding:14px;border-radius:var(--r);background:var(--surface-2);display:flex;gap:12px;align-items:center}

/* Common pieces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;background:var(--maple);color:var(--maple-ink);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--maple);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--maple-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tap{transition:transform .15s,border-color .15s;text-align:left}
.tap:hover{transform:translateY(-2px);border-color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--amber-soft);color:var(--ink)}
.pill.maple{background:var(--maple-soft);color:var(--maple)}
.pill.good{background:var(--good-soft);color:var(--good)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2 .jpn{font-size:.85rem;color:var(--ink-3);margin-left:8px;font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--maple));border-radius:99px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;font-size:.9rem;align-self:flex-start}
.back:hover{color:var(--maple)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px;background:
  radial-gradient(120% 90% at 100% 0%,var(--amber-soft),transparent 60%),
  radial-gradient(90% 80% at 0% 100%,var(--maple-soft),transparent 60%),var(--surface);border:1px solid var(--line);
  display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media (min-width:640px){.hero{grid-template-columns:1fr 190px;padding:32px}}
.hero .owl-big{width:150px;height:150px;justify-self:center;position:relative;z-index:1}
@media (min-width:640px){.hero .owl-big{width:190px;height:190px}}
.hero-text{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;min-width:0}
.hero .greet{font-family:var(--f-display);color:var(--maple);font-size:1.05rem;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaves svg{position:absolute;top:-30px;width:20px;height:20px;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0)}50%{transform:translate(-30px,140px) rotate(160deg)}100%{transform:translate(10px,320px) rotate(320deg);opacity:0}}
.owl-eyes{transform-origin:60px 66px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.owl-bob{animation:bob 4s ease-in-out infinite;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.leaves{display:none}}

/* Feature tiles */
.feat{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.feat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--maple-soft);color:var(--maple)}
.feat .ico svg{width:24px;height:24px}
.feat .ico.am{background:var(--amber-soft);color:var(--amber)}
.feat b{font-size:1.02rem}
.feat .jpn{font-family:var(--f-display);color:var(--ink-3);font-size:.85rem;margin-left:6px}

/* Roadmap */
.road{display:flex;flex-direction:column;gap:0;position:relative}
.stage{display:grid;grid-template-columns:52px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage::before{content:"";position:absolute;left:25px;top:52px;bottom:0;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.stage:last-child::before{display:none}
.stage .badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;background:var(--surface);border:2px solid var(--line);color:var(--ink-2)}
.stage.done .badge{background:var(--maple);border-color:var(--maple);color:var(--maple-ink)}
.stage.cur .badge{border-color:var(--maple);color:var(--maple)}
.stage-body{padding:16px;min-width:0}
.stage-body header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.lessons{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.lrow:hover{background:var(--amber-soft)}
.lrow .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.lrow.ok .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.lrow .chk svg{width:14px;height:14px}
.lrow .t{flex:1;min-width:0}
.lrow .t small{display:block;color:var(--ink-3);font-size:.78rem}

/* Lesson */
.point{padding:20px;display:flex;flex-direction:column;gap:12px}
.pattern{font-size:1.25rem;font-weight:700;color:var(--maple);font-family:var(--f-body);line-height:2}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.ex .jp{font-size:1.2rem}
.ex .tr{color:var(--ink-2);font-size:.9rem;line-height:1.5}
.ex>div{min-width:0;flex:1}
.vtab{width:100%;border-collapse:collapse}
.vtab td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.vtab td:first-child{font-size:1.15rem;font-weight:500;line-height:2.1}
.vtab td:last-child{width:46px}
.tblwrap{overflow-x:auto}
.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kana{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kana b{font-size:clamp(1.4rem,1rem + 2vw,2.2rem);font-weight:500;line-height:1}
.kana small{color:var(--ink-3);font-weight:700;font-size:.78rem}
.kana:hover{border-color:var(--maple);background:var(--maple-soft)}
.kana.empty{visibility:hidden}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:12px;gap:4px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--maple);box-shadow:var(--shadow)}

/* Quiz */
.q{padding:20px;display:flex;flex-direction:column;gap:14px}
.q .stem{font-size:1.2rem;line-height:2.2;font-weight:500}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:1.05rem;line-height:1.9;display:flex;gap:10px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;line-height:1}
.opt:hover{border-color:var(--amber)}
.opt.sel{border-color:var(--maple);background:var(--maple-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts.locked .opt{pointer-events:none}
.expl{padding:14px 16px;border-radius:12px;background:var(--amber-soft);font-size:.95rem;line-height:1.8}
.expl b{color:var(--maple)}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.qnav button.ans{background:var(--amber-soft)}
.qnav button.cur{outline:2px solid var(--maple)}
.qnav button.r{background:var(--good-soft);color:var(--good)}
.qnav button.w{background:var(--bad-soft);color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;color:var(--maple)}
.score-ring{width:140px;height:140px}
.confirm{padding:14px;border-radius:12px;background:var(--maple-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Kaiwa */
.chat{display:flex;flex-direction:column;gap:14px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.bub .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--amber-soft);color:var(--ink)}
.bub .msg{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);min-width:0}
.bub .who{font-size:.72rem;color:var(--ink-3);font-weight:700}
.bub .jp{font-size:1.15rem;line-height:2.1}
.bub .tr{color:var(--ink-2);font-size:.88rem;line-height:1.5}
.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bub.me .msg{border-radius:16px 16px 4px 16px;background:var(--maple-soft);border-color:transparent}
.bub.me .av{background:var(--maple);color:var(--maple-ink)}
.bub.playing .msg{outline:2px solid var(--amber)}
.bub .iconbtn{width:32px;height:32px}
.pop{animation:pop .3s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface-2);border-radius:0 12px 12px 0;font-size:.92rem;line-height:1.8}

/* Games */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px}
.mcard{aspect-ratio:3/4;border-radius:14px;background:var(--maple);color:var(--maple-ink);display:grid;place-items:center;font-size:1.6rem;font-weight:700;position:relative}
.mcard.back-face::after{content:"";width:40%;height:40%;background:currentColor;opacity:.25;-webkit-mask:var(--leaf) center/contain no-repeat;mask:var(--leaf) center/contain no-repeat}
.mcard.up{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.mcard.got{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.flash{min-height:240px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;width:100%}
.flash .big{font-size:2rem;line-height:2.2;font-weight:500}
.slots{min-height:64px;padding:12px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:1.1rem;line-height:2;font-weight:500}
.tok:hover{border-color:var(--maple)}
.tok.used{visibility:hidden}
.bigkana{font-size:4.5rem;line-height:1;font-weight:500;text-align:center;padding:24px 0}

/* Profile */
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.weekbars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekbars i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--amber);min-height:3px}
.weekbars .today i{background:var(--maple)}
.weekbars small{font-size:.72rem;color:var(--ink-3);font-weight:700}
.weekbars span{font-size:.7rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{padding:14px 10px;text-align:center;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.55}
.bdg.on{opacity:1;background:var(--amber-soft)}
.bdg .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-display);font-weight:800;color:var(--ink-3);font-size:1.1rem}
.bdg.on .medal{background:var(--maple);color:var(--maple-ink)}
.bdg b{font-size:.85rem}.bdg small{font-size:.72rem;color:var(--ink-2);line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.88rem}

.mp-opts{display:flex;gap:8px;flex:1;min-width:220px}
.mp-o{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;font:inherit}
.mp-o .jp{font-size:1.3rem;line-height:1.7;font-weight:700}.mp-o small{color:var(--ink-2);font-size:.78rem}
.mp-o:disabled{cursor:default}.mp-o:not(:disabled):hover{border-color:var(--maple)}
.mp-o.right{border-color:var(--good);background:var(--good-soft)}.mp-o.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mp-res{flex-basis:100%;font-size:.9rem}.mp-res .jp{font-size:1.05rem;line-height:1.6;font-weight:700}
.kana-grid.c3 .kana{aspect-ratio:auto;padding:8px 0}.mp-res .ok{color:var(--good)}.mp-res .no{color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--maple);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.nm-in{display:flex;gap:8px;flex-wrap:wrap}.nm-in input{flex:1;min-width:180px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1rem}
.nm-in input:focus{outline:none;border-color:var(--maple)}
.nm-ex{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;font:inherit;font-size:.85rem}.chip:hover{border-color:var(--maple)}
.nm-out{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--maple-soft)}
.nm-k{font-size:1.9rem;font-weight:700;line-height:1.4;color:var(--maple);word-break:break-all}
.kw-done{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,var(--surface),var(--amber-soft))}

const IG=(x,y,s,inner,fl)=>`<g transform="translate(${x} ${y}) scale(${fl?-s:s} ${s})">${inner}</g>`;

 const hand=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="3.6" fill="${k}"/>`;
 const armL=`<path d="M-13 -55 L-18 -33" stroke="${c}" stroke-width="7" stroke-linecap="round"/>${hand(-18,-31)}`;

 const gl=o.gl?`<g fill="none" stroke="#2B1F17" stroke-width="1.3"><circle cx="-4.6" cy="-74" r="3.8"/><circle cx="4.6" cy="-74" r="3.8"/><path d="M-0.8 -74h1.6"/></g>`:'';

const BIKE=(x,y,s=1,c='#3E7D4F')=>IG(x,y,s,`<g fill="none" stroke="#333" stroke-width="2.5"><circle cx="-18" cy="-12" r="11"/><circle cx="18" cy="-12" r="11"/></g><path d="M-18 -12 L-4 -12 L10 -30 L-8 -30 Z M10 -30 L18 -12 M-8 -30 L-10 -36 M10 -30 L8 -38 L15 -38" stroke="${c}" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`);
const PLANE=(x,y,s=1)=>IG(x,y,s,`<path d="M-40 0 Q-40 -8 -30 -8 L30 -8 Q44 -6 46 0 Q44 6 30 6 L-30 6 Q-40 6 -40 0Z" fill="#FFFFFF" stroke="#9AB" stroke-width="1"/><path d="M-6 -6 L-20 -26 L-10 -26 L12 -6Z M-6 6 L-18 22 L-8 22 L12 6Z M-34 -6 L-42 -20 L-34 -20 L-24 -6Z" fill="#B5462F"/>${[-18,-8,2,12,22].map(a=>`<circle cx="${a}" cy="-1" r="2" fill="#6F8FB8"/>`).join('')}`);

   {p:'V辞書形{じしょけい} / Nの + 上{うえ}で(は / も)',e:'"Dalam hal / untuk keperluan…". Berbeda dengan Vた上{うえ}で (= setelah). Sering: 生活{せいかつ}する上{うえ}で, 仕事{しごと}の上{うえ}で.',ex:[['日本{にほん}で生活{せいかつ}する上{うえ}で、ゴミの分{わ}け方{かた}は大切{たいせつ}だ。','Dalam hal hidup di Jepang, cara memilah sampah itu penting.'],['仕事{しごと}の上{うえ}では、報告{ほうこく}・連絡{れんらく}・相談{そうだん}が基本{きほん}です。','Dalam pekerjaan, melapor, menghubungi, dan berkonsultasi adalah dasarnya.']]},

   {p:'N + 向{む}きだ / 向{む}きの + N',e:'"Cocok untuk…". Sifat benda itu kebetulan sesuai dengan sasaran. Lawan katanya 不向{ふむ}き.',ex:[['このコースは坂{さか}が少{すく}なくて、初心{しょしん}者{しゃ}向{む}きだ。','Jalur ini sedikit tanjakannya, jadi cocok untuk pemula.'],['彼{かれ}は細{こま}かい作業{さぎょう}には不向{ふむ}きだ。','Dia tidak cocok untuk pekerjaan yang detail.']]},

  scene:{bg:'plain',alt:'Pesta kembang api di tepi sungai pada malam musim panas',
   art:()=>`<rect width="400" height="240" fill="#22284A"/><g fill="none" stroke-width="3" stroke-linecap="round"><g stroke="#F4B642"><path d="M120 70 l0 -26 M120 70 l18 -18 M120 70 l26 0 M120 70 l18 18 M120 70 l0 26 M120 70 l-18 18 M120 70 l-26 0 M120 70 l-18 -18"/></g><g stroke="#E85D75"><path d="M270 60 l0 -22 M270 60 l16 -16 M270 60 l22 0 M270 60 l16 16 M270 60 l0 22 M270 60 l-16 16 M270 60 l-22 0 M270 60 l-16 -16"/></g></g><rect y="200" width="400" height="40" fill="#2F6F8F"/>`+P(110,215,1.05,{c:'#4F7CAC',talk:1})+P(190,215,1.05,{c:'#B5462F',long:1,flip:1}),
   bub:[[110,106,'わあ、きれい！','Wah, indah!']],
   hot:[[90,40,60,60,'思{おも}わず声{こえ}を出{だ}してしまいました。','Tanpa sadar saya berseru.']]},
  points:[
   {p:'① Baca seluruh paragraf dulu',e:'Jangan langsung melihat pilihan. Pahami alur cerita sebelum dan sesudah bagian kosong. Soal 文章{ぶんしょう}の文法{ぶんぽう} menguji hubungan antar-kalimat, bukan satu kalimat saja.',ex:[['前{まえ}の文{ぶん}と後{うし}ろの文{ぶん}の関係{かんけい}を考{かんが}える。','Pikirkan hubungan kalimat sebelum dan sesudahnya.']]},
   {p:'② Kata sambung (接続{せつぞく}詞{し})',e:'Tentukan hubungan logisnya: sebab-akibat (だから・そのため), berlawanan (しかし・ところが), tambahan (そのうえ・また), penjelasan (つまり), atau contoh (たとえば).',ex:[['雨{あめ}が強{つよ}かった。しかし、試合{しあい}は行{おこな}われた。','Hujan deras. Namun, pertandingan tetap diadakan.']]},
   {p:'③ Sudut pandang dan bentuk akhir',e:'Siapa yang berbicara? Informasi dari orang lain memakai そうだ atau ということだ. Perasaan spontan memakai Vてしまう. Rencana penulis memakai Vたいと思{おも}っている.',ex:[['友人{ゆうじん}によると、明日{あした}は休{やす}みだそうだ。','Menurut teman saya, besok katanya libur.']]},
   {p:'④ Periksa tense dan keigo',e:'Esai pengalaman biasanya bentuk lampau. Tindakan orang yang dihormati memakai くださる atau いらっしゃる, bukan あげる.',ex:[['先生{せんせい}が駅{えき}まで送{おく}ってくださいました。','Guru mengantar saya sampai stasiun.']]}],
  rd:[{h:'文章{ぶんしょう}の文法{ぶんぽう}',t:'Esai mahasiswa asing · 留学{りゅうがく}生{せい}の作文{さくぶん}',a:[
   '私{わたし}の国{くに}では、花火{はなび}は新年{しんねん}を祝{いわ}うときに少{すこ}し見{み}るぐらいで、夏{なつ}の行事{ぎょうじ}ではありません。（ ① ）、日本{にほん}に来{き}て初{はじ}めての夏{なつ}、友人{ゆうじん}に「花火{はなび}大会{たいかい}に行{い}こう」と誘{さそ}われたときは、あまりぴんと来{き}ませんでした。',
   '当日{とうじつ}、会場{かいじょう}の河原{かわら}には、浴衣{ゆかた}を着{き}た人々{ひとびと}が何万人{なんまんにん}も集{あつ}まっていました。夜{よる}七時{しちじ}半{はん}、最初{さいしょ}の花火{はなび}が上{あ}がると、大{おお}きな音{おと}とともに夜空{よぞら}が明{あか}るくなり、周{まわ}りから「わあ」という声{こえ}が上{あ}がりました。私{わたし}も思{おも}わず声{こえ}を出{だ}して（ ② ）。',
   '花火{はなび}は一{いち}時間{じかん}半{はん}にわたって、休{やす}みなく打{う}ち上{あ}げられました。中{なか}でも印象{いんしょう}に残{のこ}ったのは、最後{さいご}に上{あ}がった大{おお}きな金色{きんいろ}の花火{はなび}です。消{き}えたあとも、しばらくだれも動{うご}こうとしませんでした。友人{ゆうじん}によると、日本人{にほんじん}は花火{はなび}が消{き}える瞬間{しゅんかん}の「はかなさ」も美{うつく}しいと（ ③ ）。',
   '帰{かえ}り道{みち}、駅{えき}は大変{たいへん}混雑{こんざつ}していて、電車{でんしゃ}に乗{の}るまで四十分{よんじゅっぷん}も待{ま}たされました。（ ④ ）、不思議{ふしぎ}と嫌{いや}な気持{きも}ちにはなりませんでした。来年{らいねん}は私{わたし}も浴衣{ゆかた}を着{き}て、また（ ⑤ ）。'],
   tr:['Di negara saya, kembang api hanya sedikit dilihat saat merayakan tahun baru dan bukan acara musim panas. ( ① ), ketika pada musim panas pertama di Jepang teman mengajak saya, "Ayo ke festival kembang api," saya tidak terlalu tertarik.',
   'Pada hari itu, di bantaran sungai tempat acara, puluhan ribu orang berkumpul mengenakan yukata. Pukul setengah delapan malam, begitu kembang api pertama meluncur, langit malam menjadi terang bersamaan dengan suara keras, dan terdengar seruan "Wah" dari sekitar. Saya pun tanpa sadar ( ② ) berseru.',
   'Kembang api diluncurkan tanpa henti selama satu setengah jam. Yang paling berkesan adalah kembang api emas besar yang diluncurkan terakhir. Setelah padam pun, untuk sesaat tidak ada yang mau beranjak. Menurut teman saya, orang Jepang ( ③ ) juga merasakan keindahan pada "kefanaan" saat kembang api padam.',
   'Saat pulang, stasiun sangat padat dan saya harus menunggu empat puluh menit sampai bisa naik kereta. ( ④ ), anehnya saya tidak merasa kesal. Tahun depan, saya juga ingin mengenakan yukata dan ( ⑤ ).']}],
  vx:[['行事{ぎょうじ}','acara tahunan'],['誘{さそ}う','mengajak'],['ぴんと来{こ}ない','tidak terasa / kurang tertarik'],['河原{かわら}','bantaran sungai'],['思{おも}わず','tanpa sadar'],['打{う}ち上{あ}げる','meluncurkan'],['はかなさ','kefanaan'],['混雑{こんざつ}','padat / ramai']],
  quiz:[

   {q:'（ ② ）に入{はい}るものはどれか。',o:['しまいました','みせました','あげました','おきました'],a:0,x:'思{おも}わず ("tanpa sadar") cocok dengan Vてしまう yang menunjukkan tindakan spontan: <b>しまいました</b>.'},
   {q:'（ ③ ）に入{はい}るものはどれか。',o:['感{かん}じるのだそうです','感{かん}じるつもりです','感{かん}じたがっています','感{かん}じさせます'],a:0,x:'Ada 友人{ゆうじん}によると, jadi informasi ini dari orang lain. Akhir kalimat yang cocok: <b>そうです</b> (katanya).'},
   {q:'（ ④ ）に入{はい}るものはどれか。',o:['しかし','そのため','それに','すると'],a:0,x:'Menunggu lama biasanya membuat kesal, tetapi penulis tidak kesal. Hubungan berlawanan: <b>しかし</b>.'},
   {q:'（ ⑤ ）に入{はい}るものはどれか。',o:['行{い}ってみたいと思{おも}っています','行{い}ったことがあります','行{い}くはずでした','行{い}かせられました'],a:0,x:'来年{らいねん} menunjukkan rencana atau keinginan penulis di masa depan: <b>行{い}ってみたいと思{おも}っています</b>.'}]},

  points:[
   {p:'① Baca pertanyaan lebih dulu',e:'Teks pendek (sekitar 200 karakter) biasanya hanya punya satu soal. Ketahui dulu apa yang ditanyakan: maksud utama, kata tunjuk, atau isi yang sesuai.',ex:[['このメールで一番{いちばん}伝{つた}えたいことは何{なに}か。','Apa hal yang paling ingin disampaikan email ini?']]},
   {p:'② Inti biasanya di akhir',e:'Dalam esai Jepang, pendapat penulis sering muncul di kalimat terakhir. Perhatikan ungkapan seperti 〜のではないだろうか, 〜べきだ, 〜かもしれない.',ex:[['実{じつ}はいちばん確{たし}かな道{みち}なのかもしれない。','Mungkin justru itulah jalan yang paling pasti.']]},
   {p:'③ Pengumuman: perhatikan ただし dan なお',e:'Kata ただし (namun) dan なお (selain itu) membawa syarat atau pengecualian. Soal sering menguji bagian ini.',ex:[['ただし、CDは返却{へんきゃく}ポストに入{い}れないでください。','Namun, CD jangan dimasukkan ke kotak pengembalian.']]},
   {p:'④ Kata tunjuk (指示{しじ}語{ご})',e:'それ, この, そうした biasanya merujuk ke kalimat tepat sebelumnya. Coba ganti kata tunjuk dengan jawaban pilihan, lalu baca ulang kalimatnya.',ex:[['それこそが、本当{ほんとう}の意味{いみ}だ。','Justru itulah makna yang sebenarnya.']]}],
  rd:[{h:'短文{たんぶん} ①',t:'Email kantor · 社内{しゃない}メール',a:['件名{けんめい}：健康{けんこう}診断{しんだん}の日程{にってい}変更{へんこう}について','社員{しゃいん}各位{かくい}','お疲{つか}れさまです。総務{そうむ}部{ぶ}の山本{やまもと}です。','十{じゅう}月{がつ}十五日{じゅうごにち}（水{すい}）に予定{よてい}しておりました健康{けんこう}診断{しんだん}は、会場{かいじょう}の都合{つごう}により、十{じゅう}月{がつ}二十二日{にじゅうににち}（水{すい}）に変更{へんこう}となりました。時間{じかん}と場所{ばしょ}に変更{へんこう}はありません。','なお、二十二日{にじゅうににち}にどうしても都合{つごう}がつかない方{かた}は、今月{こんげつ}末{まつ}までに総務{そうむ}部{ぶ}へご連絡{れんらく}ください。別{べつ}の日程{にってい}をご案内{あんない}いたします。'],
    tr:['Perihal: Perubahan jadwal pemeriksaan kesehatan','Kepada seluruh karyawan','Terima kasih atas kerja kerasnya. Saya Yamamoto dari bagian umum.','Pemeriksaan kesehatan yang dijadwalkan pada Rabu, 15 Oktober diubah menjadi Rabu, 22 Oktober karena kendala tempat. Tidak ada perubahan jam dan lokasi.','Selain itu, bagi yang benar-benar tidak bisa pada tanggal 22, mohon menghubungi bagian umum paling lambat akhir bulan ini. Kami akan memberikan jadwal lain.']},
   {h:'短文{たんぶん} ②',t:'Esai · エッセイ',a:['外国{がいこく}語{ご}を学{まな}ぶ人{ひと}の多{おお}くは、できるだけ早{はや}く話{はな}せるようになる方法{ほうほう}を探{さが}している。私{わたし}もかつてはそうだった。しかし、近道{ちかみち}を探{さが}して教材{きょうざい}を次々{つぎつぎ}に変{か}えるうちに、どれも中途{ちゅうと}半端{はんぱ}に終{お}わってしまった。結局{けっきょく}、力{ちから}がついたのは、一冊{いっさつ}の教科{きょうか}書{しょ}を何度{なんど}も繰{く}り返{かえ}し読{よ}んだときである。遠回{とおまわ}りに見{み}える方法{ほうほう}が、実{じつ}はいちばん確{たし}かな道{みち}なのかもしれない。'],
    tr:['Banyak orang yang belajar bahasa asing mencari cara agar bisa berbicara secepat mungkin. Dulu saya juga begitu. Namun, saat mencari jalan pintas dan terus berganti buku ajar, semuanya berakhir setengah-setengah. Pada akhirnya, kemampuan saya meningkat ketika saya membaca satu buku pelajaran berulang kali. Cara yang tampak memutar justru mungkin jalan yang paling pasti.']},
   {h:'短文{たんぶん} ③',t:'Pengumuman · お知{し}らせ',a:['【市{し}立{りつ}図書{としょ}館{かん}からのお知{し}らせ】','館内{かんない}整理{せいり}のため、十一{じゅういち}月{がつ}四日{よっか}（月{げつ}）から八日{ようか}（金{きん}）まで休館{きゅうかん}いたします。休館{きゅうかん}中{ちゅう}も、正面{しょうめん}入口{いりぐち}横{よこ}の返却{へんきゃく}ポストはご利用{りよう}いただけます。','ただし、CDやDVDは壊{こわ}れるおそれがありますので、返却{へんきゃく}ポストには入{い}れず、開館日{かいかんび}にカウンターへお返{かえ}しください。また、休館{きゅうかん}中{ちゅう}に返却{へんきゃく}期限{きげん}を迎{むか}える本{ほん}は、自動{じどう}的{てき}に十一{じゅういち}月{がつ}十五日{じゅうごにち}まで延長{えんちょう}されます。'],
    tr:['[Pemberitahuan dari Perpustakaan Kota]','Perpustakaan tutup mulai Senin, 4 November sampai Jumat, 8 November untuk penataan. Selama tutup, kotak pengembalian di samping pintu depan tetap bisa digunakan.','Namun, CD dan DVD bisa rusak, jadi jangan dimasukkan ke kotak pengembalian. Kembalikan ke konter pada hari perpustakaan buka. Selain itu, buku yang batas pengembaliannya jatuh selama perpustakaan tutup akan diperpanjang otomatis sampai 15 November.']},
   {h:'短文{たんぶん} ④',t:'Artikel bisnis · ビジネスコラム',a:['部下{ぶか}を育{そだ}てるとき、ほめることは大切{たいせつ}だと言{い}われる。だが、ただ「よくやった」と言{い}うだけでは、相手{あいて}の心{こころ}にはあまり残{のこ}らない。大事{だいじ}なのは、何{なに}がどうよかったのかを具体{ぐたい}的{てき}に伝{つた}えることだ。たとえば「資料{しりょう}のグラフが見{み}やすくて、会議{かいぎ}が早{はや}く進{すす}んだ」と言{い}われれば、部下{ぶか}は次{つぎ}に何{なに}をすればいいかがわかる。<u>それ</u>こそが、ほめることの本当{ほんとう}の意味{いみ}ではないだろうか。'],
    tr:['Dalam membina bawahan, katanya memuji itu penting. Namun, jika hanya berkata "Kerja bagus", itu tidak terlalu membekas di hati. Yang penting adalah menyampaikan secara konkret apa yang bagus dan bagaimana. Misalnya, jika dikatakan "Grafik di materimu mudah dibaca, jadi rapat berjalan cepat", bawahan akan tahu apa yang harus dilakukan berikutnya. Bukankah justru itu makna sebenarnya dari memuji?']}],

  quiz:[
   {q:'【短文{たんぶん}①】このメールで最{もっと}も伝{つた}えたいことは何{なに}か。',o:['健康{けんこう}診断{しんだん}の日{ひ}が変{か}わったこと、変更{へんこう}後{ご}の日{ひ}に受{う}けられない人{ひと}は連絡{れんらく}すること','健康{けんこう}診断{しんだん}の時間{じかん}と場所{ばしょ}が変{か}わったこと','健康{けんこう}診断{しんだん}を受{う}けない人{ひと}は、今月{こんげつ}末{まつ}までに連絡{れんらく}すること','会場{かいじょう}が使{つか}えないため、健康{けんこう}診断{しんだん}が中止{ちゅうし}になったこと'],a:0,x:'Isi utamanya: tanggal berubah (十{じゅう}月{がつ}二十二日{にじゅうににち}に変更{へんこう}) dan yang tidak bisa harus menghubungi (なお…ご連絡{れんらく}ください). Jam dan tempat 「変更{へんこう}はありません」.'},
   {q:'【短文{たんぶん}②】筆者{ひっしゃ}の考{かんが}えに合{あ}うものはどれか。',o:['一{ひと}つの教材{きょうざい}をじっくり続{つづ}けることが、結果{けっか}的{てき}に上達{じょうたつ}への近道{ちかみち}になる','早{はや}く話{はな}せるようになるには、いろいろな教材{きょうざい}を試{ため}すべきだ','教科{きょうか}書{しょ}を読{よ}むだけでは、外国{がいこく}語{ご}は上達{じょうたつ}しない','外国{がいこく}語{ご}には近道{ちかみち}があるので、探{さが}す努力{どりょく}が大切{たいせつ}だ'],a:0,x:'Kalimat kunci di akhir: 「遠回{とおまわ}りに見{み}える方法{ほうほう}が、実{じつ}はいちばん確{たし}かな道{みち}なのかもしれない」. Cara yang tampak lambat (satu buku diulang) justru paling efektif.'},
   {q:'【短文{たんぶん}③】休館{きゅうかん}中{ちゅう}について、正{ただ}しいものはどれか。',o:['本{ほん}は返却{へんきゃく}ポストに返{かえ}せるが、DVDはカウンターに返{かえ}す必要{ひつよう}がある','本{ほん}もDVDも、返却{へんきゃく}ポストに返{かえ}すことができる','返却{へんきゃく}期限{きげん}を延{の}ばしたい人{ひと}は、カウンターで手続{てつづ}きをする','休館{きゅうかん}中{ちゅう}は、返却{へんきゃく}ポストも利用{りよう}できない'],a:0,x:'ただし membawa pengecualian: CD dan DVD 「返却{へんきゃく}ポストには入{い}れず…カウンターへ」. Perpanjangan terjadi 「自動{じどう}的{てき}に」, tidak perlu prosedur.'},
   {q:'【短文{たんぶん}④】「それ」とは何{なに}か。',o:['よかった点{てん}を具体{ぐたい}的{てき}に伝{つた}えて、部下{ぶか}が次{つぎ}にするべきことがわかるようにすること','部下{ぶか}に「よくやった」と言{い}うこと','会議{かいぎ}を早{はや}く進{すす}めること','資料{しりょう}のグラフを見{み}やすく作{つく}ること'],a:0,x:'それ merujuk ke kalimat sebelumnya: memuji secara konkret sehingga bawahan tahu 「次{つぎ}に何{なに}をすればいいか」.'}]},

   hot:[[250,120,56,44,'祖母{そぼ}からの手紙{てがみ}を毎月{まいつき}楽{たの}しみにしていた。','Setiap bulan saya menantikan surat dari nenek.']]},
  points:[
   {p:'① Satu paragraf = satu ide',e:'Teks sedang terdiri dari tiga sampai lima paragraf. Setelah membaca tiap paragraf, ringkas idenya dalam satu kalimat bahasa Indonesia.',ex:[['第{だい}一{いち}段落{だんらく}：便利{べんり}になった。第{だい}二{に}段落{だんらく}：失{うしな}ったものもある。','Paragraf 1: hidup jadi praktis. Paragraf 2: ada juga yang hilang.']]},
   {p:'② Bagian bergaris bawah',e:'Jawaban hampir selalu ada di sekitar bagian bergaris bawah. Baca satu atau dua kalimat sebelum dan sesudahnya.',ex:[['〜からこそ、…と感{かん}じられたのだ。','Justru karena…, maka terasa….']]},
   {p:'③ Penanda alasan dan pendapat',e:'Alasan: 〜から, 〜ため, 〜からこそ. Pendapat: 〜のではないだろうか, 〜と思{おも}う, 〜たい. Penyangkalan sebagian: 〜わけではない (bukan berarti…).',ex:[['昔{むかし}に戻{もど}るべきだと言{い}いたいわけではない。','Bukan berarti saya ingin mengatakan kita harus kembali ke masa lalu.']]},
   {p:'④ Waspadai pilihan yang terlalu ekstrem',e:'Pilihan yang memakai すべて, 必{かなら}ず, べきだ secara berlebihan sering salah karena penulis biasanya berpendapat secara seimbang.',ex:[['もちろん、〜。ただ、〜。','Tentu saja… Hanya saja….']]}],
  rd:[{h:'中文{ちゅうぶん}',t:'Esai · 随筆{ずいひつ}',a:[
   '最近{さいきん}、何{なに}かを「待{ま}つ」ということが、ずいぶん少{すく}なくなったように思{おも}う。調{しら}べたいことがあれば、スマートフォンですぐに答{こた}えが見{み}つかる。友人{ゆうじん}との待{ま}ち合{あ}わせに遅{おく}れそうなときも、メッセージを一{ひと}つ送{おく}れば済{す}む。買{か}い物{もの}も、注文{ちゅうもん}した翌日{よくじつ}には商品{しょうひん}が届{とど}く。便利{べんり}になったことは間違{まちが}いない。',
   'しかし、<u>① その便利{べんり}さと引{ひ}きかえに、私{わたし}たちは何{なに}かを失{うしな}ってはいないだろうか</u>。子{こ}どものころ、私{わたし}は遠{とお}くに住{す}む祖母{そぼ}から届{とど}く手紙{てがみ}を、毎月{まいつき}楽{たの}しみにしていた。郵便{ゆうびん}受{う}けをのぞいては、まだ来{こ}ないとがっかりし、届{とど}いた日{ひ}には何度{なんど}も読{よ}み返{かえ}した。待{ま}っている時間{じかん}があったからこそ、一通{いっつう}の手紙{てがみ}がとても大切{たいせつ}なものに感{かん}じられたのだ。',
   '待{ま}つ時間{じかん}は、ただの無駄{むだ}な時間{じかん}ではない。相手{あいて}のことを考{かんが}えたり、これから起{お}こることを想像{そうぞう}したりする時間{じかん}でもある。答{こた}えがすぐに手{て}に入{はい}らないとき、人{ひと}は自分{じぶん}の頭{あたま}で考{かんが}えようとする。<u>② そうした時間{じかん}</u>が、物事{ものごと}を深{ふか}く味{あじ}わう力{ちから}を育{そだ}てているのではないだろうか。',
   'もちろん、昔{むかし}の不便{ふべん}な生活{せいかつ}に戻{もど}るべきだと言{い}いたいわけではない。ただ、すぐに答{こた}えを求{もと}める前{まえ}に、少{すこ}し立{た}ち止{ど}まって待{ま}ってみる。そんな小{ちい}さな余裕{よゆう}を、私{わたし}は大切{たいせつ}にしたいと思{おも}っている。'],
   tr:['Akhir-akhir ini, saya merasa kegiatan "menunggu" sudah jauh berkurang. Kalau ada yang ingin dicari tahu, jawabannya langsung ditemukan di ponsel pintar. Saat hampir terlambat bertemu teman pun, cukup kirim satu pesan. Belanja pun, barang tiba keesokan hari setelah dipesan. Tidak diragukan lagi hidup jadi lebih praktis.',
   'Namun, (1) bukankah sebagai ganti kepraktisan itu kita kehilangan sesuatu? Waktu kecil, setiap bulan saya menantikan surat dari nenek yang tinggal jauh. Saya mengintip kotak pos, kecewa kalau belum datang, dan pada hari surat tiba saya membacanya berulang kali. Justru karena ada waktu menunggu, sepucuk surat terasa sangat berharga.',
   'Waktu menunggu bukan sekadar waktu yang terbuang. Itu juga waktu untuk memikirkan orang lain dan membayangkan apa yang akan terjadi. Ketika jawaban tidak langsung didapat, orang berusaha berpikir dengan kepalanya sendiri. Bukankah (2) waktu seperti itulah yang menumbuhkan kemampuan menikmati sesuatu secara mendalam?',
   'Tentu saja, bukan berarti saya ingin mengatakan kita harus kembali ke kehidupan dulu yang serba tidak praktis. Hanya saja, sebelum langsung mencari jawaban, cobalah berhenti sejenak dan menunggu. Saya ingin menghargai kelonggaran kecil seperti itu.']}],
  vx:[['待{ま}ち合{あ}わせ','janji bertemu'],['引{ひ}きかえに','sebagai gantinya'],['郵便{ゆうびん}受{う}け','kotak pos'],['読{よ}み返{かえ}す','membaca ulang'],['無駄{むだ}','sia-sia'],['味{あじ}わう','menikmati'],['立{た}ち止{ど}まる','berhenti sejenak'],['余裕{よゆう}','kelonggaran']],
  quiz:[
   {q:'①「その便利{べんり}さと引{ひ}きかえに、私{わたし}たちは何{なに}かを失{うしな}ってはいないだろうか」とあるが、筆者{ひっしゃ}はどのようなことを心配{しんぱい}しているか。',o:['便利{べんり}になったことで、待{ま}つ時間{じかん}が持{も}つよさを感{かん}じられなくなっていること','スマートフォンのせいで、友人{ゆうじん}との約束{やくそく}を守{まも}らなくなったこと','手紙{てがみ}を書{か}く人{ひと}が減{へ}って、郵便{ゆうびん}が使{つか}われなくなること','買{か}い物{もの}が便利{べんり}になって、お金{かね}を使{つか}いすぎること'],a:0,x:'Paragraf berikutnya menjelaskan nilai dari 「待{ま}っている時間{じかん}」. Yang hilang karena kepraktisan adalah kebaikan dari waktu menunggu.'},
   {q:'筆者{ひっしゃ}が祖母{そぼ}からの手紙{てがみ}を大切{たいせつ}に感{かん}じたのはなぜか。',o:['届{とど}くまで待{ま}つ時間{じかん}があったから','祖母{そぼ}が遠{とお}くに住{す}んでいて、めったに会{あ}えなかったから','手紙{てがみ}に珍{めずら}しい話{はなし}が書{か}いてあったから','毎月{まいつき}決{き}まった日{ひ}に必{かなら}ず届{とど}いたから'],a:0,x:'Kalimat kunci: 「待{ま}っている時間{じかん}があったからこそ、一通{いっつう}の手紙{てがみ}がとても大切{たいせつ}なものに感{かん}じられたのだ」.'},
   {q:'②「そうした時間{じかん}」とはどのような時間{じかん}か。',o:['相手{あいて}のことを考{かんが}えたり、これから起{お}こることを想像{そうぞう}したりする時間{じかん}','スマートフォンで答{こた}えを調{しら}べる時間{じかん}','手紙{てがみ}を何度{なんど}も読{よ}み返{かえ}す時間{じかん}','何{なに}もしないで休{やす}んでいる時間{じかん}'],a:0,x:'そうした merujuk ke kalimat sebelumnya: 「相手{あいて}のことを考{かんが}えたり、これから起{お}こることを想像{そうぞう}したりする時間{じかん}」 dan berpikir sendiri.'},
   {q:'この文章{ぶんしょう}で筆者{ひっしゃ}が言{い}いたいことは何{なに}か。',o:['便利{べんり}な生活{せいかつ}の中{なか}でも、少{すこ}し待{ま}ってみる余裕{よゆう}を大切{たいせつ}にしたい','不便{ふべん}な昔{むかし}の生活{せいかつ}に戻{もど}ったほうが、人{ひと}は幸{しあわ}せになれる','スマートフォンは、考{かんが}える力{ちから}を育{そだ}てるのに役{やく}に立{た}つ','待{ま}つ時間{じかん}は無駄{むだ}なので、できるだけ減{へ}らすべきだ'],a:0,x:'Paragraf terakhir: penulis tidak ingin kembali ke masa lalu (わけではない), tetapi 「そんな小{ちい}さな余裕{よゆう}を、私{わたし}は大切{たいせつ}にしたい」. Pilihan 2 terlalu ekstrem.'}]},
 {id:'n2-r4',title:'Membaca 4 · Membandingkan Dua Teks',jp:'統合{とうごう}理解{りかい}',sum:'Dua opini (A dan B) tentang kerja sampingan: mencari titik yang sama, perbedaan sikap, dan alasan masing-masing.',
  scene:{bg:'room',alt:'Dua karyawan berdiskusi dengan papan berisi pendapat A dan B',
   art:()=>BOARD(215,12,220,74,'',14)+`<line x1="215" y1="22" x2="215" y2="78" stroke="#FFFDF8" stroke-width="2" stroke-dasharray="5 5"/>`+TXT(160,44,'A',22,'#F4B642',800)+TXT(270,44,'B',22,'#F4B642',800)+TXT(160,72,'賛成',13,'#FFFDF8',700)+TXT(270,72,'慎重',13,'#FFFDF8',700)+P(90,215,1.05,{c:'#4F7CAC',tie:'#B5462F',talk:1})+P(320,215,1.05,{c:'#3B3F4A',h:'#555',gl:1,tie:'#2F6F8F',flip:1}),
   bub:[[90,106,'副業{ふくぎょう}、賛成{さんせい}です。','Saya setuju kerja sampingan.']],
   hot:[[300,26,26,26,'Bは、一人一人{ひとりひとり}の状況{じょうきょう}を見{み}て判断{はんだん}するべきだと考{かんが}えている。','B berpendapat harus diputuskan dengan melihat kondisi tiap orang.']]},
  points:[
   {p:'① Tandai sikap A dan B',e:'Setelah membaca, tulis singkat: A = setuju / tidak / bersyarat; B = setuju / tidak / bersyarat. Soal kedua hampir selalu menanyakan perbedaan sikap ini.',ex:[['Aは前向{まえむ}き、Bは慎重{しんちょう}。','A positif, B berhati-hati.']]},
   {p:'② Cari titik yang sama',e:'Soal 「AとBのどちらにも触{ふ}れられている」 menanyakan hal yang disebut di kedua teks. Pilihan yang hanya ada di satu teks adalah jebakan.',ex:[['両方{りょうほう}に「新{あたら}しい知識{ちしき}・スキル」が出{で}てくる。','Di kedua teks muncul "pengetahuan atau keterampilan baru".']]},
   {p:'③ Perhatikan 確{たし}かに〜。しかし〜',e:'Pola ini berarti penulis mengakui satu sisi, lalu menyampaikan pendapat utamanya setelah しかし. Pendapat utama ada di bagian kedua.',ex:[['確{たし}かによさはある。しかし、問題{もんだい}もある。','Memang ada kebaikannya. Namun, ada juga masalahnya.']]},
   {p:'④ Kalimat terakhir tiap teks',e:'Kesimpulan biasanya memakai べきだ, だろう, ではないか. Bandingkan dua kalimat terakhir untuk menjawab soal sikap.',ex:[['〜を認{みと}めていくべきだろう。','Sebaiknya kita mulai mengizinkan….']]}],
  rd:[{k:'A',h:'統合{とうごう}理解{りかい} · A',t:'Opini · 意見{いけん}文{ぶん}',a:['最近{さいきん}、社員{しゃいん}の副業{ふくぎょう}を認{みと}める会社{かいしゃ}が増{ふ}えている。副業{ふくぎょう}を通{つう}じて、社員{しゃいん}は本業{ほんぎょう}では得{え}られない知識{ちしき}や人脈{じんみゃく}を手{て}に入{い}れることができる。そうした経験{けいけん}が本業{ほんぎょう}に生{い}かされれば、会社{かいしゃ}にとってもプラスになるはずだ。また、収入{しゅうにゅう}源{げん}が一{ひと}つではないという安心{あんしん}感{かん}は、社員{しゃいん}が新{あたら}しいことに挑戦{ちょうせん}する力{ちから}にもなる。','もちろん、働{はたら}きすぎで体{からだ}を壊{こわ}しては意味{いみ}がない。会社{かいしゃ}は労働{ろうどう}時間{じかん}をきちんと把握{はあく}する仕組{しく}みを整{ととの}えたうえで、副業{ふくぎょう}を前向{まえむ}きに認{みと}めていくべきだろう。'],
    tr:['Akhir-akhir ini, perusahaan yang mengizinkan kerja sampingan bagi karyawannya semakin banyak. Melalui kerja sampingan, karyawan bisa mendapatkan pengetahuan dan jaringan yang tidak didapat di pekerjaan utama. Jika pengalaman itu dimanfaatkan di pekerjaan utama, tentu menguntungkan perusahaan juga. Selain itu, rasa aman karena sumber penghasilan tidak hanya satu juga menjadi kekuatan bagi karyawan untuk mencoba hal baru.','Tentu saja, tidak ada artinya jika jatuh sakit karena terlalu banyak bekerja. Setelah menyiapkan sistem untuk memantau jam kerja dengan baik, perusahaan sebaiknya mengizinkan kerja sampingan secara positif.']},
   {k:'B',h:'統合{とうごう}理解{りかい} · B',t:'Opini · 意見{いけん}文{ぶん}',a:['副業{ふくぎょう}には、確{たし}かに新{あたら}しいスキルが身{み}につくというよさがある。しかし、本業{ほんぎょう}が終{お}わってから別{べつ}の仕事{しごと}をすれば、休{やす}む時間{じかん}はそれだけ減{へ}る。疲{つか}れがたまれば、本業{ほんぎょう}でのミスにつながりかねない。また、同{おな}じ業界{ぎょうかい}で副業{ふくぎょう}をする場合{ばあい}、会社{かいしゃ}の情報{じょうほう}が外{そと}にもれる心配{しんぱい}もある。','副業{ふくぎょう}を認{みと}めるかどうかは、会社{かいしゃ}が一律{いちりつ}に決{き}めるのではなく、仕事{しごと}の内容{ないよう}や本人{ほんにん}の働{はたら}き方{かた}を一人一人{ひとりひとり}確認{かくにん}したうえで判断{はんだん}するべきだ。'],
    tr:['Kerja sampingan memang punya kebaikan, yaitu bisa mendapatkan keterampilan baru. Namun, jika bekerja lagi setelah pekerjaan utama selesai, waktu istirahat berkurang sebanyak itu. Jika kelelahan menumpuk, bisa-bisa berujung pada kesalahan di pekerjaan utama. Selain itu, jika kerja sampingan di industri yang sama, ada kekhawatiran informasi perusahaan bocor ke luar.','Mengizinkan kerja sampingan atau tidak sebaiknya tidak diputuskan perusahaan secara seragam, tetapi setelah memeriksa isi pekerjaan dan cara kerja tiap orang satu per satu.']}],
  vx:[['副業{ふくぎょう}','kerja sampingan'],['本業{ほんぎょう}','pekerjaan utama'],['人脈{じんみゃく}','jaringan relasi'],['収入{しゅうにゅう}源{げん}','sumber penghasilan'],['把握{はあく}','memahami / memantau'],['前向{まえむ}き','positif'],['一律{いちりつ}','seragam'],['もれる','bocor']],
  quiz:[
   {q:'AとBのどちらにも触{ふ}れられている内容{ないよう}はどれか。',o:['副業{ふくぎょう}によって、新{あたら}しい知識{ちしき}や技術{ぎじゅつ}が得{え}られること','副業{ふくぎょう}が、収入{しゅうにゅう}の面{めん}で安心{あんしん}感{かん}につながること','会社{かいしゃ}の情報{じょうほう}が外{そと}にもれる危険{きけん}があること','同{おな}じ業界{ぎょうかい}での副業{ふくぎょう}は禁止{きんし}するべきであること'],a:0,x:'A: 「本業{ほんぎょう}では得{え}られない知識{ちしき}」, B: 「新{あたら}しいスキルが身{み}につく」. Rasa aman penghasilan hanya di A, kebocoran informasi hanya di B.'},
   {q:'副業{ふくぎょう}について、AとBはどのような立場{たちば}をとっているか。',o:['Aは条件{じょうけん}を整{ととの}えたうえで積極{せっきょく}的{てき}に認{みと}めるべきだと考{かんが}え、Bは一人一人{ひとりひとり}の状況{じょうきょう}を見{み}て判断{はんだん}するべきだと考{かんが}えている','AもBも、副業{ふくぎょう}は認{みと}めるべきではないと考{かんが}えている','Aは副業{ふくぎょう}に反対{はんたい}し、Bは賛成{さんせい}している','AもBも、会社{かいしゃ}が一律{いちりつ}に認{みと}めるべきだと考{かんが}えている'],a:0,x:'Kalimat terakhir A: 「仕組{しく}みを整{ととの}えたうえで、前向{まえむ}きに認{みと}めていくべき」. B: 「一律{いちりつ}に決{き}めるのではなく…一人一人{ひとりひとり}確認{かくにん}したうえで判断{はんだん}するべき」.'},
   {q:'働{はたら}きすぎの問題{もんだい}について、正{ただ}しいものはどれか。',o:['Aは会社{かいしゃ}が労働{ろうどう}時間{じかん}を把握{はあく}するべきだと述{の}べ、Bは本業{ほんぎょう}のミスにつながる危険{きけん}を述{の}べている','Aだけが働{はたら}きすぎの問題{もんだい}に触{ふ}れている','Bだけが働{はたら}きすぎの問題{もんだい}に触{ふ}れている','AもBも、働{はたら}きすぎは大{おお}きな問題{もんだい}ではないと述{の}べている'],a:0,x:'A: 「働{はたら}きすぎで体{からだ}を壊{こわ}しては意味{いみ}がない…労働{ろうどう}時間{じかん}をきちんと把握{はあく}」. B: 「疲{つか}れがたまれば、本業{ほんぎょう}でのミスにつながりかねない」. Keduanya menyinggungnya.'}]},
 {id:'n2-r5',title:'Membaca 5 · Memahami Pendapat Penulis',jp:'主張{しゅちょう}理解{りかい}',sum:'Esai panjang sekitar 800 karakter: menemukan pendapat utama, fungsi contoh, dan makna bagian bergaris bawah.',
  scene:{bg:'room',alt:'Andi berpikir keras di depan buku yang sulit',
   art:()=>DESK(200,215,1.5)+BOOK(200,176,1.1,'#2F6F8F')+P(110,215,1.1,{c:'#4F7CAC',talk:1})+THINK(300,70,130,70,QMARK(300,70,.9)),
   bub:[[110,106,'君{きみ}はどう思{おも}う？','Menurutmu bagaimana?']],
   hot:[[170,162,60,26,'わからないまま、しばらく考{かんが}え続{つづ}けてみる。','Cobalah terus berpikir sejenak, meski belum paham.']]},
  points:[
   {p:'① Pendapat utama: cari kata 私{わたし}',e:'Dalam esai panjang, kalimat yang memuat 私{わたし}は〜と思{おも}う, 〜と私{わたし}は感{かん}じている, 〜のではないか adalah tempat pendapat penulis. Biasanya di paragraf kedua dan terakhir.',ex:[['〜と私{わたし}は思{おも}う。','Menurut saya….']]},
   {p:'② Fungsi contoh dan pengalaman',e:'Cerita pribadi atau contoh (たとえば, 私{わたし}が学生{がくせい}だったころ) dipakai untuk mendukung pendapat. Soal 「なぜこの例{れい}を書{か}いたか」 jawabannya adalah pendapat yang didukung.',ex:[['今{いま}思{おも}えば、あの時間{じかん}が〜てくれたのだ。','Kalau dipikir sekarang, waktu itulah yang….']]},
   {p:'③ Pola 確{たし}かに〜。しかし〜。',e:'Bagian 確{たし}かに (memang) adalah pendapat umum yang diakui. Pendapat penulis yang sebenarnya ada setelah しかし.',ex:[['たしかに大切{たいせつ}だ。しかし、求{もと}めすぎている。','Memang penting. Namun, kita terlalu menuntutnya.']]},

   'しかし、最近{さいきん}の社会{しゃかい}は「わかりやすさ」を求{もと}めすぎているのではないか、と私{わたし}は感{かん}じている。テレビのニュースは短{みじか}い言葉{ことば}と派手{はで}な図{ず}でまとめられ、本{ほん}の帯{おび}には「すぐわかる」「一冊{いっさつ}で全部{ぜんぶ}わかる」といった言葉{ことば}が並{なら}ぶ。複雑{ふくざつ}な問題{もんだい}でも、だれかが簡単{かんたん}な答{こた}えを用意{ようい}してくれるのが当{あ}たり前{まえ}になりつつある。',
   '問題{もんだい}は、<u>① わかったつもりになること</u>である。物事{ものごと}の多{おお}くは、本来{ほんらい}、簡単{かんたん}には説明{せつめい}できない。経済{けいざい}の動{うご}きも、人{ひと}の心{こころ}も、さまざまな原因{げんいん}が重{かさ}なり合{あ}ってできている。それを一言{ひとこと}でまとめれば、たしかに覚{おぼ}えやすい。だが、その一言{ひとこと}からこぼれ落{お}ちた部分{ぶぶん}にこそ、本当{ほんとう}に大切{たいせつ}なことが隠{かく}れている場合{ばあい}も少{すく}なくない。わかりやすい説明{せつめい}だけで満足{まんぞく}していると、人{ひと}は自分{じぶん}で調{しら}べたり、別{べつ}の見{み}方{かた}を考{かんが}えたりしなくなる。',
   '私{わたし}が学生{がくせい}だったころ、ある先生{せんせい}は質問{しつもん}をしても、すぐには答{こた}えてくれなかった。「君{きみ}はどう思{おも}う？」と聞{き}き返{かえ}し、私{わたし}が考{かんが}えをまとめるまで黙{だま}って待{ま}っていた。当時{とうじ}はもどかしく感{かん}じたが、今{いま}思{おも}えば、あの時間{じかん}が私{わたし}に考{かんが}える習慣{しゅうかん}をつけてくれたのだ。',

   tr:['"Tolong jelaskan dengan lebih mudah dipahami." Ungkapan ini sering terdengar, baik di tempat kerja maupun sekolah. Memang penting bagi pihak penyampai untuk berusaha berbicara agar mudah dipahami. Dengan penjelasan yang penuh istilah teknis, pendengar akan tertinggal.',

 if(!('speechSynthesis' in window)){toast('Suara belum didukung di perangkat ini');onend&&onend();return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spk(t));u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=S.set.rate;if(speak.p)u.pitch=speak.p;
 let fired=false;const fin=()=>{if(!fired){fired=true;onend&&onend()}};u.onend=fin;
 u.onerror=e=>{const loc=jaVoices.find(v=>v.localService);if(!speak.r&&jaVoice&&!jaVoice.localService&&loc&&e&&e.error!=='interrupted'&&e.error!=='canceled'){speak.r=1;const v2=new SpeechSynthesisUtterance(u.text);v2.lang='ja-JP';v2.voice=loc;v2.rate=u.rate;v2.pitch=u.pitch;v2.onend=fin;v2.onerror=fin;speechSynthesis.speak(v2);setTimeout(()=>speak.r=0,500)}else fin()};speechSynthesis.speak(u);

function nm2k(w){w=w.toLowerCase().replace(/[^a-z]/g,'').replace(/x/g,'ks').replace(/([^aiueo])y$/,'$1i');const out=[];let i=0;

  if(ch in KV){const v=KAV[KV[ch]];if(out.length&&out[out.length-1].v===ch){out.push({k:'ー'});i++;continue}out.push({k:v,v:ch});i++;continue}
  if(ch==='n'&&nx==='g'&&!(w[i+2] in KV)){out.push({k:'ン'});i+=2;continue}
  if(ch==='n'&&!(nx in KV)&&nx!=='y'){out.push({k:'ン'});i++;continue}
  if(ch==='m'&&'bpm'.includes(nx||'#')){out.push({k:'ン'});i++;continue}
  if(ch===nx&&(w[i+2] in KV)){out.push({k:ch==='m'||ch==='n'?'ン':'ッ'});i++;continue}
  if(ch==='h'&&nx===undefined&&out.length&&out[out.length-1].v){i++;continue}

  if(v in KV&&KC[key]){const row=KC[key];out.push({k:row[KV[v]],v});i+=len+1;continue}
  out.push({k:KCO[ch]||''});i++}
 return out.map(o=>o.k).join('')}

function fixBubbles(){document.querySelectorAll('.scene-art').forEach(a=>{const A=a.getBoundingClientRect(),bs=[...a.querySelectorAll('.sb')],placed=[];
 bs.forEach(b=>{b.style.setProperty('--dx','0px');b.style.setProperty('--dy','0px');b.style.transition='none';b.style.whiteSpace='';b.style.width='';if(b.offsetWidth>A.width-8){b.style.whiteSpace='normal';b.style.width=(A.width-8)+'px'}});
 bs.forEach(b=>{const r=b.getBoundingClientRect();let dx=0,dy=0;if(r.left<A.left+4)dx=A.left+4-r.left;else if(r.right>A.right-4)dx=A.right-4-r.right;
  const q={l:r.left+dx,r:r.right+dx,t:r.top,b:r.bottom};let moved=true,guard=0;

  return `${back}<section class="card" style="padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap">${ring(Q.pct/100,140,Q.pct+'%')}<div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Hasil ${Q.mode==='tryout'?'tryout':'latihan'}</span><h1>${esc(Q.title)}</h1><p class="num"><b>${Q.correct}</b> dari ${Q.qs.length} benar · +${Q.xp} XP</p><p class="muted">${msg}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="retryQuiz">Ulangi</button><button class="btn ghost" data-act="exitQuiz">Kembali</button></div></div></section>
  <section style="display:flex;flex-direction:column;gap:12px"><div class="sec-head"><h2>Pembahasan<span class="jpn">解説</span></h2><span class="muted" style="font-size:.88rem">Klik nomor untuk melihat jawaban dan penjelasan</span></div>
   <div class="qnav">${Q.qs.map((q,i)=>`<button class="${isRight(q,Q.ans[i])?'r':'w'} ${UI.rev===i?'cur':''} num" data-act="rev" data-i="${i}">${i+1}</button>`).join('')}</div>
   ${UI.rev!==null?qCard(Q.qs[UI.rev],UI.rev,Q.ans[UI.rev],Q.mode,true):''}</section>`}
 const q=Q.qs[Q.i],a=Q.ans[Q.i];const prac=Q.mode==='latihan';const reveal=prac&&a!==undefined;const last=Q.i===Q.qs.length-1;
 const answered=Object.keys(Q.ans).length;
 return `${back}<header style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><span class="eyebrow">${prac?'Latihan':'Tryout'} · soal ${Q.i+1}/${Q.qs.length}</span><h1>${esc(Q.title)}</h1></div>${Q.end?`<span class="chip-stat timer">${ic('clock')}<span id="timer">${fmt(Q.end-Date.now())}</span></span>`:''}</header>
 <div class="bar"><i style="width:${(prac?Q.i+(reveal?1:0):answered)/Q.qs.length*100}%"></i></div>
 ${qCard(q,Q.i,a,Q.mode,reveal)}
 <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
  ${prac?`<span></span><button class="btn" data-act="${last?'finish':'qNext'}" ${reveal?'':'disabled'}>${last?'Lihat hasil':'Soal berikutnya'}</button>`
  :`<button class="btn ghost" data-act="qPrev" ${Q.i?'':'disabled'}>Sebelumnya</button><div style="display:flex;gap:8px;flex-wrap:wrap">${last?'':`<button class="btn ghost" data-act="qNext">Berikutnya</button>`}<button class="btn" data-act="askSubmit">Kumpulkan</button></div>`}
 </div>
 ${UI.confirmSubmit?`<div class="confirm pop"><span style="flex:1;min-width:200px">${answered<Q.qs.length?`Masih ada <b>${Q.qs.length-answered}</b> soal belum dijawab. Tetap kumpulkan?`:'Kumpulkan jawaban sekarang?'}</span><button class="btn sm" data-act="finish">Ya, kumpulkan</button><button class="btn sm ghost" data-act="cancelSubmit">Batal</button></div>`:''}
 ${prac?'':`<div class="qnav">${Q.qs.map((x,i)=>`<button class="${Q.ans[i]!==undefined?'ans':''} ${i===Q.i?'cur':''} num" data-act="qGo" data-i="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join('')}</div>`}`;
}

/* ===================== GAME ===================== */
const KPOOL=ROMA.map((r,i)=>i).filter(i=>ROMA[i]!=='-');
const GLV=[['kana','かな','Kana Dasar'],['n5','N5','Pemula'],['n4','N4','Dasar Lanjut'],['n3','N3','Menengah'],['n2','N2','Menengah Atas'],['n1','N1','Mahir'],['biz','ビジ','Bisnis']];
const GDEF={
 vq:{jp:'語彙スピード',name:'Kilat Kosakata',desc:'Tebak arti kata sebanyak mungkin dalam 60 detik. Jawaban beruntun melipatgandakan skor.',meta:['60 detik','Combo ×4']},
 pm:{jp:'ペアマッチ',name:'Pasangan Kata',desc:'Buka kartu dan cocokkan kata Jepang dengan artinya.',meta:['6 pasang','Memori']},
 gc:{jp:'文法チャレンジ',name:'Tantangan Tata Bahasa',desc:'Jawab soal pola kalimat dan baca penjelasannya. Salah tiga kali, permainan selesai.',meta:['10 soal','3 nyawa']},
 ss:{jp:'文づくり',name:'Susun Kalimat',desc:'Urutkan potongan kata menjadi kalimat yang benar, lalu dengarkan pelafalannya.',meta:['5 kalimat','Suara']},
 fc:{jp:'単語カード',name:'Flashcard',desc:'Kartu bolak-balik dengan suara. Geser ke kanan jika hafal, ke kiri jika belum. Kartu yang belum hafal muncul lagi sampai dikuasai.',meta:['Swipe','Suara','2 arah']},
 km:{jp:'敬語マスター',name:'Keigo Master',desc:'Ubah kata kerja biasa menjadi 尊敬語 atau 謙譲語 secepat mungkin. Latihan wajib sebelum masuk kantor Jepang.',meta:['45 detik','Combo ×4','12 kata kerja']}
};
const GDEF_K={
 vq:{jp:'かなスピード',name:'Kilat Kana',desc:'Tebak cara baca hiragana dan katakana sebanyak mungkin dalam 60 detik.',meta:['60 detik','92 huruf']},
 pm:{jp:'かなマッチ',name:'Kana Match',desc:'Pasangkan kartu huruf kana dengan cara bacanya.',meta:['6 pasang','Memori']},
 fc:{jp:'かなカード',name:'Flashcard Kana',desc:'Hafalkan 92 huruf hiragana dan katakana dengan kartu bolak-balik bersuara. Geser ke kanan jika hafal.',meta:['Swipe','Suara','2 arah']}
};
const gd=(t,lv)=>(lv==='kana'&&GDEF_K[t])||GDEF[t];
const gList=lv=>lv==='kana'?['fc','vq','pm']:lv==='biz'?['km','fc','vq','pm','gc','ss']:['fc','vq','pm','gc','ss'];
const lvOf=id=>LEVELS.find(x=>x.id===id);
const lvName=lv=>{const x=GLV.find(v=>v[0]===lv);return x?x[1]+' · '+x[2]:''};
const gPool=lv=>lv==='kana'?KPOOL.flatMap(i=>[[HIRA[i],ROMA[i]],[KATA[i],ROMA[i]]]):lvOf(lv).lessons.flatMap(x=>x.vocab||[]).concat(VOCAB_X[lv]||[]);
const lvSent=lv=>lvOf(lv).lessons.flatMap(x=>(x.points||[]).flatMap(p=>p.ex)).filter(e=>!/[…→？]/.test(e[0])).map(e=>[e[0].split(' ').filter(Boolean),e[1]]).filter(e=>e[0].length>=3&&e[0].length<=7);
const lvQs=lv=>lvOf(lv).lessons.flatMap(x=>x.quiz||[]).map(q=>({q:q.q,o:q.o,a:q.a,x:q.x})).concat(QB.filter(q=>q[0]===lv).map(q=>({q:q[2],o:q[3],a:q[4],x:q[5]})));
const starKey=(t,lv)=>t+'-'+lv;
const getStars=(t,lv)=>(S.stars||{})[starKey(t,lv)]||0;
const lvStars=lv=>gList(lv).reduce((a,t)=>a+getStars(t,lv),0);
const starsHtml=(n,size=16)=>[0,1,2].map(i=>`<svg width="${size}" height="${size}" style="color:${i<n?'var(--amber)':'var(--line)'}" aria-hidden="true"><use href="#i-star"/></svg>`).join('');

function initGame(t,lv){const g={t,lv,over:false,stars:0};
 if(t==='vq'||t==='km'){const dur=t==='km'?45:60;return Object.assign(g,{pool:gPool(lv),score:0,correct:0,combo:0,maxCombo:0,left:dur,dur,run:false,q:null,lock:false,fb:''})}
 if(t==='pm'){const pick=[],seen=new Set();for(const v of shuffle(gPool(lv))){if(!seen.has(v[1])){seen.add(v[1]);pick.push(v)}if(pick.length===6)break}
  return Object.assign(g,{cards:shuffle(pick.flatMap((v,i)=>[{id:i,f:v[0],jp:1},{id:i,f:v[1]}])),open:[],got:[],moves:0,start:Date.now(),busy:false})}
 if(t==='gc')return Object.assign(g,{qs:shuffle(lvQs(lv)).slice(0,10).map(q=>Object.assign({p:shuffle(q.o.map((_,j)=>j))},q)),i:0,lives:3,correct:0,ans:null});
 if(t==='fc'){const n=fcUnique(lv).length;return Object.assign(g,{dir:'jp',size:n>10?10:0,bab:0,run:false})}
 if(t==='ss')return Object.assign(g,{sents:shuffle(lvSent(lv)).slice(0,5),i:0,pick:[],bank:null,res:null,correct:0});
}
function vqQ(g){const P=g.pool;let k;do{k=Math.floor(Math.random()*P.length)}while(P.length>1&&g.q&&P[k][0]===g.q.w);
 const ans=P[k][1],ds=shuffle([...new Set(P.map(v=>v[1]).filter(m=>m!==ans))]).slice(0,3),opts=shuffle([ans,...ds]);
 g.q={w:P[k][0],opts,a:opts.indexOf(ans)};g.lock=false}
function kmQ(g){const rows=[];KEIGO.forEach(r=>[2,3].forEach(c=>{if(r[c]!=='—')rows.push([r,c])}));
 let pick;do{pick=rows[Math.floor(Math.random()*rows.length)]}while(g.q&&pick[0][1]===g.q.verb&&pick[1]===g.q.c);
 const [r,c]=pick,ans=r[c],other=r[c===2?3:2];let ds=other!=='—'&&other!==ans?[other]:[];
 const all=[...new Set(KEIGO.flatMap(x=>[x[2],x[3]]))].filter(v=>v!=='—'&&v!==ans&&!ds.includes(v));
 ds=ds.concat(shuffle(all).slice(0,3-ds.length));const opts=shuffle([ans,...ds]);
 g.q={verb:r[1],mean:r[0],c,opts,a:opts.indexOf(ans)};g.lock=false}
function gRun(g){g.run=true;g.left=g.dur;g.fb='';(g.t==='km'?kmQ:vqQ)(g);render();
 timers.push(setInterval(()=>{if(UI.game!==g)return;g.left--;const el=$('#gtime'),b=$('#gbar');if(el)el.textContent=g.left;if(b)b.style.width=(g.left/g.dur*100)+'%';
  if(g.left<=0){g.run=false;const c=g.correct,st=g.t==='km'?(c>=12?3:c>=7?2:c>=1?1:0):(c>=15?3:c>=9?2:c>=1?1:0);gFinish(g,st,g.score,gd(g.t,g.lv).name)}},1000))}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const w=document.createElement('div');w.className='burst';w.setAttribute('aria-hidden','true');
 const c=['var(--maple)','var(--amber)','var(--gold)'];for(let i=0;i<22;i++)w.innerHTML+=`<svg style="left:${Math.random()*100}%;--dx:${Math.round(Math.random()*160-80)}px;animation-delay:${(Math.random()*.5).toFixed(2)}s;color:${c[i%3]}"><use href="#leaf"/></svg>`;
 document.body.appendChild(w);setTimeout(()=>w.remove(),2600)}
function gFinish(g,stars,score,label){if(g.over)return;g.over=true;g.run=false;g.stars=stars;g.score=score;stopTimers();
 const k=starKey(g.t,g.lv);S.stars=S.stars||{};g.newBest=stars>(S.stars[k]||0);if(g.newBest)S.stars[k]=stars;
 if(score>(S.best['g-'+k]||0))S.best['g-'+k]=score;if(g.correct!==undefined&&g.correct>(S.best['c-'+k]||0))S.best['c-'+k]=g.correct;
 save();addXP(5+stars*5,label);if(UI.game===g){render();window.scrollTo(0,0)}if(stars>=2)burst()}
const gBack=(t,lv)=>`<button class="back" data-act="exitGame">${ic('left').replace('<svg','<svg width="18" height="18"')} Semua game</button><header style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">${lvName(lv)} · ${gd(t,lv).jp}</span><h1>${gd(t,lv).name}</h1></header>`;
function gResult(g,line){const msg=g.stars===3?'すばらしい！ Sempurna!':g.stars===2?'いいね！ Sedikit lagi bintang tiga.':g.stars===1?'がんばって！ Coba lagi untuk bintang lebih banyak.':'まだまだ！ Ulangi materinya, lalu coba lagi.';
 return `<div class="card pop gres"><svg width="88" height="88" class="owl-bob" role="img" aria-label="Maskot burung hantu"><use href="#owl"/></svg><div class="gres-stars">${starsHtml(g.stars,36)}</div><h2>${msg}</h2><p class="muted num">${line}</p>${g.newBest?'<span class="pill good">Rekor bintang baru</span>':''}
 <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="startGame" data-g="${g.t}" data-lv="${g.lv}">Main lagi</button><button class="btn ghost" data-act="exitGame">Pilih game lain</button></div></div>`}
function vGame(){
 if(UI.game)return({vq:vTimed,km:vTimed,pm:vPM,gc:vGC,ss:vSS,fc:vFC})[UI.game.t]();
 const lv=UI.gLv||'n5',tot=GLV.reduce((a,v)=>a+lvStars(v[0]),0),max=GLV.reduce((a,v)=>a+gList(v[0]).length*3,0);
 return `<div class="sec-head"><div><span class="eyebrow">Game · ゲーム</span><h1>Belajar sambil bermain</h1></div><span class="chip-stat">${ic('star')}<span class="num">${tot}/${max} bintang</span></span></div>
 <p class="muted" style="max-width:62ch">Pilih level, lalu kumpulkan tiga bintang di setiap game. Kosakata dan soal diambil langsung dari materi level tersebut.</p>
 <div class="lvtabs" role="tablist">${GLV.map(v=>{const n=lvStars(v[0]),m=gList(v[0]).length*3;return `<button class="lvtab ${v[0]===lv?'on':''}" role="tab" aria-selected="${v[0]===lv}" data-act="gLv" data-id="${v[0]}"><b>${v[1]}</b><span style="font-weight:700;font-size:.88rem">${v[2]}</span><div class="bar"><i style="width:${n/m*100}%"></i></div><small class="num">${n}/${m} bintang</small></button>`}).join('')}</div>
 <div class="grid g2">${gList(lv).map((t,i)=>{const d=gd(t,lv),b=S.best['g-'+starKey(t,lv)];return `<button class="card tap gcard ${t==='fc'||(lv==='biz'&&t==='km')?'wide':''}" data-act="startGame" data-g="${t}" data-lv="${lv}"><div style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px"><span style="font-family:var(--f-display);color:var(--maple);font-weight:700">${d.jp}</span><span class="gstars">${starsHtml(getStars(t,lv),18)}</span></div><h3>${d.name}</h3><span class="muted" style="font-size:.9rem">${d.desc}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${d.meta.map(m=>`<span class="pill">${m}</span>`).join('')}${t==='fc'?`<span class="pill num">Dikuasai ${fcMastered(lv)}/${fcUnique(lv).length}</span>`:''}${b?`<span class="pill good num">Skor terbaik ${b}</span>`:''}</span></button>`}).join('')}</div>`;
}
function gIntro(g,rules){return `${gBack(g.t,g.lv)}<div class="card gintro"><p>${rules}</p><div style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:.88rem">Bintang terbaik</span>${starsHtml(getStars(g.t,g.lv),18)}</div><button class="btn" data-act="gStart">Mulai</button></div>`}
function vTimed(){const g=UI.game,km=g.t==='km';
 if(g.over)return gBack(g.t,g.lv)+gResult(g,`${g.score} poin · ${g.correct} benar · combo terbaik ${g.maxCombo}`);
 if(!g.run)return gIntro(g,km?'Sebuah kata kerja muncul bersama targetnya: 尊敬語 (hormat) atau 謙譲語 (rendah hati). Pilih bentuk yang benar sebanyak mungkin dalam <b>45 detik</b>. 12 benar = tiga bintang.':g.lv==='kana'?'Tebak cara baca huruf hiragana dan katakana sebanyak mungkin dalam <b>60 detik</b>. 15 benar = tiga bintang.':`Tebak arti kosakata ${lvName(g.lv)} sebanyak mungkin dalam <b>60 detik</b>. Tiga jawaban benar berturut-turut menaikkan pengali skor hingga ×4. 15 benar = tiga bintang.`);
 const q=g.q,mult=Math.min(4,1+Math.floor(g.combo/3));
 return `${gBack(g.t,g.lv)}<div class="hud"><div class="tbar"><i id="gbar" style="width:${g.left/g.dur*100}%"></i></div><span class="chip-stat timer">${ic('clock')}<span id="gtime" class="num">${g.left}</span>s</span><span class="chip-stat num">${g.score} poin</span>${g.combo>=2?`<span class="chip-stat combo num">コンボ ${g.combo} · ×${mult}</span>`:''}${g.fb?`<span class="fb pop">${g.fb}</span>`:''}</div>
 <div class="card gq">${km?`<span class="eyebrow">Ubah ke ${q.c===2?'尊敬語 · hormat':'謙譲語 · rendah hati'}</span><div class="gword">${rb(q.verb)}</div><span class="muted">${esc(q.mean)}</span>`:`<span class="eyebrow">${g.lv==='kana'?'Bagaimana cara bacanya?':'Apa artinya?'}</span><div class="gword ${g.lv==='kana'?'kana-big':''}">${rb(q.w)}</div>`}
 <div class="opts">${q.opts.map((o,j)=>`<button class="opt" style="justify-content:center;text-align:center" data-act="gAns" data-o="${j}">${km?rb(o):esc(o)}</button>`).join('')}</div></div>`}
function vPM(){const g=UI.game,win=g.got.length===g.cards.length;
 if(win&&!g.fin){g.fin=true;g.sec=Math.round((Date.now()-g.start)/1000);const st=g.moves<=9?3:g.moves<=13?2:1;setTimeout(()=>gFinish(g,st,Math.max(10,200-g.moves*8-g.sec),gd(g.t,g.lv).name),600)}
 if(g.over)return gBack(g.t,g.lv)+gResult(g,`${g.moves} langkah · ${g.sec} detik`);
 return `${gBack(g.t,g.lv)}<p class="muted">Buka dua kartu. Jika ${g.lv==='kana'?'huruf dan cara bacanya':'kata dan artinya'} cocok, kartu tetap terbuka. Selesai dalam 9 langkah = tiga bintang.</p>
 <div class="hud"><span class="chip-stat num">Langkah ${g.moves}</span><span class="chip-stat num">Pasangan ${g.got.length/2}/${g.cards.length/2}</span></div>
 <div class="mgrid ${g.lv==='kana'?'':'wide'}">${g.cards.map((c,i)=>{const up=g.open.includes(i)||g.got.includes(i);return `<button class="mcard ${up?'up':''} ${g.got.includes(i)?'got':''}" data-act="pmFlip" data-i="${i}" aria-label="${up?esc(c.jp?kana(c.f):c.f):'Kartu tertutup'}">${up?`<span class="${c.jp?'mjp':'mtx'}">${c.jp?rb(c.f):esc(c.f)}</span>`:`<svg width="30" height="30" style="opacity:.45"><use href="#leaf"/></svg>`}</button>`}).join('')}</div>`}
function vGC(){const g=UI.game;
 if(g.over)return gBack(g.t,g.lv)+gResult(g,`${g.correct} dari ${g.qs.length} benar · sisa nyawa ${g.lives}`);
 const q=g.qs[g.i],a=g.ans,lock=a!==null,last=g.i===g.qs.length-1||g.lives===0;
 return `${gBack(g.t,g.lv)}<div class="hud"><span class="hearts" role="img" aria-label="Sisa nyawa ${g.lives}">${[0,1,2].map(i=>`<svg width="24" height="24" style="color:${i<g.lives?'var(--maple)':'var(--line)'}" aria-hidden="true"><use href="#i-heart"/></svg>`).join('')}</span><span class="chip-stat num">Soal ${g.i+1}/${g.qs.length}</span><span class="chip-stat num">Benar ${g.correct}</span></div>
 <div class="bar"><i style="width:${(g.i+(lock?1:0))/g.qs.length*100}%"></i></div>
 <article class="card q"><div class="stem">${rb(q.q)}</div><div class="opts ${lock?'locked':''}">${q.p.map((oi,j)=>{let c='';if(lock){if(oi===q.a)c='right';else if(j===a)c='wrong'}return `<button class="opt ${c}" data-act="gcPick" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${rb(q.o[oi])}</span></button>`}).join('')}</div>
 ${lock?`<div class="expl pop"><b>${q.p[a]===q.a?'正解！ Benar.':'Belum tepat.'}</b> ${rbh(q.x)}</div><button class="btn" style="align-self:flex-end" data-act="gcNext">${last?'Lihat hasil':'Soal berikutnya'}</button>`:''}</article>`}
function vSS(){const g=UI.game;
 if(g.over)return gBack(g.t,g.lv)+gResult(g,`${g.correct} dari ${g.sents.length} kalimat benar`);
 const s=g.sents[g.i],T=s[0];if(!g.bank){let b;do{b=shuffle(T.map((_,i)=>i))}while(b.every((v,i)=>T[v]===T[i]));g.bank=b}const done=g.res;
 return `${gBack(g.t,g.lv)}<div class="hud"><span class="chip-stat num">Kalimat ${g.i+1}/${g.sents.length}</span><span class="chip-stat num">Benar ${g.correct}</span></div>
 <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;max-width:720px"><span class="eyebrow">Susun menjadi kalimat Jepang</span><b style="font-size:1.12rem">${esc(s[1])}</b>
  <div class="slots">${g.pick.length?g.pick.map((ti,pi)=>`<button class="tok" data-act="sDel" data-i="${pi}" ${done?'disabled':''}>${rb(T[ti])}</button>`).join(''):'<span class="muted" style="font-size:.9rem">Ketuk potongan kata di bawah sesuai urutan</span>'}</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">${g.bank.map(ti=>`<button class="tok ${g.pick.includes(ti)?'used':''}" data-act="sAdd" data-t="${ti}" ${done?'disabled':''}>${rb(T[ti])}</button>`).join('')}</div>
  ${done?`<div class="expl pop"><b>${done==='ok'?'正解！ Benar.':'Belum tepat.'}</b> <span class="jp" style="font-size:1.1rem">${rb(T.join(' '))}</span></div>`:''}
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${done?`<button class="btn" data-act="sNext">${g.i===g.sents.length-1?'Lihat hasil':'Berikutnya'}</button>${say(T.join(''))}`:`<button class="btn" data-act="sCheck" ${g.pick.length===T.length?'':'disabled'}>Periksa</button><button class="btn ghost" data-act="sClear">Ulang</button>`}</div></div>`}

/* ---------- Flashcard ---------- */
const bare=t=>String(t).replace(RB,'$1');
const fcUnique=lv=>{const seen=new Set();return gPool(lv).filter(v=>!seen.has(v[0])&&seen.add(v[0]))};

 fcAns:d=>fcAnswer(d.v==='1'),
 gAns:(d,el)=>{const g=UI.game;if(!g||!g.run||g.lock)return;g.lock=true;const next=()=>{if(UI.game===g&&g.run){(g.t==='km'?kmQ:vqQ)(g);rerender()}};
  if(+d.o===g.q.a){g.correct++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);const m=Math.min(4,1+Math.floor(g.combo/3));g.score+=10*m;g.fb=g.combo>=3?'すごい！':'正解！';el.classList.add('right');setTimeout(next,220)}
  else{g.combo=0;g.fb='おしい！';el.classList.add('wrong','shake');const r=document.querySelector(`[data-act="gAns"][data-o="${g.q.a}"]`);r&&r.classList.add('right');setTimeout(next,700)}},
 pmFlip:d=>{const g=UI.game,i=+d.i;if(g.busy||g.fin||g.open.includes(i)||g.got.includes(i))return;g.open.push(i);
  if(g.open.length===2){g.moves++;const[a,b]=g.open;if(g.cards[a].id===g.cards[b].id){g.got.push(a,b);g.open=[];const w=g.cards[a].jp?g.cards[a]:g.cards[b];speak(w.f)}else{g.busy=true;setTimeout(()=>{g.open=[];g.busy=false;if(UI.game===g)rerender()},800)}}rerender()},
 gcPick:d=>{const g=UI.game;if(g.ans!==null)return;g.ans=+d.o;const q=g.qs[g.i];if(q.p[g.ans]===q.a)g.correct++;else g.lives--;rerender()},
 gcNext:()=>{const g=UI.game;if(g.lives===0||g.i===g.qs.length-1){const r=g.correct/g.qs.length;gFinish(g,r>=.9?3:r>=.7?2:r>=.4?1:0,g.correct*10,gd(g.t,g.lv).name)}else{g.i++;g.ans=null;render();window.scrollTo(0,0)}},
 sAdd:d=>{const g=UI.game,t=+d.t;if(!g.pick.includes(t)){g.pick.push(t);rerender()}},
 sDel:d=>{UI.game.pick.splice(+d.i,1);rerender()},
 sClear:()=>{UI.game.pick=[];rerender()},
 sCheck:()=>{const g=UI.game,T=g.sents[g.i][0];const ok=g.pick.map(i=>T[i]).join('')===T.join('');g.res=ok?'ok':'no';if(ok){g.correct++;speak(T.join(''))}rerender()},
 sNext:()=>{const g=UI.game,n=g.sents.length;if(g.i===n-1){const c=g.correct;gFinish(g,c===n?3:c>=Math.ceil(n*.6)?2:c>=1?1:0,c*20,gd(g.t,g.lv).name)}else{g.i++;g.pick=[];g.bank=null;g.res=null;rerender()}},
 setT:d=>{S.set[d.k]=!S.set[d.k];save();rerender()},
 setV:d=>{S.set[d.k]=d.k==='rate'?+d.v:d.v;save();rerender()},
 voiceSel:d=>{S.set.voice=d.v;pickVoice();save();rerender();speak('はじめまして。 日本語{にほんご}を 勉強{べんきょう}しましょう。')},
 resetAsk:()=>{UI.reset=true;rerender()},resetNo:()=>{UI.reset=false;rerender()},
 resetYes:()=>{const set=S.set,name=S.name;S=DEF();S.set=set;S.name=name;save();UI.reset=false;toast('Progres sudah diatur ulang');render()}
};
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s){e.preventDefault();speak(s.dataset.say);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a.dataset,a)}});
document.addEventListener('change',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim().slice(0,24);save();toast('Nama disimpan')}});
window.addEventListener('hashchange',go);
document.addEventListener('pointerdown',e=>{const sc=e.target.closest('.fc-scene');if(!sc||e.target.closest('button'))return;fcDrag={x:e.clientX,dx:0,sc,moved:false}});
document.addEventListener('pointermove',e=>{if(!fcDrag)return;const dx=e.clientX-fcDrag.x;fcDrag.dx=dx;if(Math.abs(dx)>8){fcDrag.moved=true;const s=fcDrag.sc;s.classList.add('drag');s.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;s.style.setProperty('--r',Math.max(0,Math.min(1,dx/110)));s.style.setProperty('--l',Math.max(0,Math.min(1,-dx/110)))}});
document.addEventListener('pointerup',()=>{if(!fcDrag)return;const d=fcDrag;fcDrag=null;if(!d.moved)return;fcSuppress=true;setTimeout(()=>{fcSuppress=false},60);
 if(d.dx>100)fcAnswer(true);else if(d.dx<-100)fcAnswer(false);else{d.sc.classList.remove('drag');d.sc.style.transform='';d.sc.style.setProperty('--r',0);d.sc.style.setProperty('--l',0)}});
document.addEventListener('pointercancel',()=>{if(fcDrag){fcDrag.sc.classList.remove('drag');fcDrag.sc.style.transform='';fcDrag=null}});
document.addEventListener('keydown',e=>{const g=UI.game;if(!g||g.t!=='fc'||!g.run||g.over)return;if(e.target.closest&&e.target.closest('input,textarea,select'))return;
 if(e.key==='ArrowRight'){e.preventDefault();fcAnswer(true)}else if(e.key==='ArrowLeft'){e.preventDefault();fcAnswer(false)}
 else if((e.key===' '||e.key==='Enter')&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();ACT.fcFlip()}});
go();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
