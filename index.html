<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Owl Nihongo: belajar bahasa Jepang dari nol sampai bisnis. Kaiwa bersuara, soal dan tryout JFT A2, game interaktif, dan progres harian.">
<meta name="theme-color" content="#B5462F">
<meta property="og:title" content="Owl Nihongo">
<meta property="og:description" content="Belajar bahasa Jepang dari nol sampai bisnis.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Owl Nihongo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Owl Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sidebar kiri (desktop) / tab bawah (HP); konten satu kolom, kartu dipakai hanya untuk objek yang bisa disentuh. */
:root{
  --bg:#FBF5EC; --surface:#FFFDF8; --surface-2:#F4EADB; --line:#E7D8C4;
  --ink:#3B2A20; --ink-2:#6E5848; --ink-3:#9A8370;
  --maple:#B5462F; --maple-ink:#FFF6EF; --maple-soft:#F6E0D6;
  --amber:#D9802F; --amber-soft:#FBE8D1; --gold:#B98A2E;
  --good:#3E7D4F; --good-soft:#DFEFE1; --bad:#B5462F; --bad-soft:#F6DDD5;
  --shadow:0 1px 2px rgba(59,42,32,.06),0 6px 20px rgba(59,42,32,.07);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --rt:.6em; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1713; --surface:#271F19; --surface-2:#32281F; --line:#46382D;
  --ink:#F3E8DA; --ink-2:#C9B39D; --ink-3:#94806D;
  --maple:#E2735B; --maple-ink:#2A130D; --maple-soft:#4A2A21;
  --amber:#EFA15A; --amber-soft:#463121; --gold:#DDB462;
  --good:#7CC08E; --good-soft:#233629; --bad:#EE8A75; --bad-soft:#4A2821;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1713; --surface:#271F19; --surface-2:#32281F; --line:#46382D;
  --ink:#F3E8DA; --ink-2:#C9B39D; --ink-3:#94806D;
  --maple:#E2735B; --maple-ink:#2A130D; --maple-soft:#4A2A21;
  --amber:#EFA15A; --amber-soft:#463121; --gold:#DDB462;
  --good:#7CC08E; --good-soft:#233629; --bad:#EE8A75; --bad-soft:#4A2821;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--maple);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:.01em}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
ruby{ruby-position:over}
rt{font-size:var(--rt);color:var(--ink-2);font-weight:500;letter-spacing:0;font-family:var(--f-body)}
.nofuri rt{display:none}
.notr .tr{display:none}
.jp{font-family:var(--f-body);font-size:1.28rem;line-height:2.25;font-weight:500}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:38px;height:38px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{font-size:.7rem;color:var(--ink-3);letter-spacing:.14em}
.chip-stat svg{width:15px;height:15px;color:var(--amber);flex:none}
.chip-stat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--ink-3);font-size:.7rem;font-weight:700}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--maple)}
.tabs a .jpn{font-size:.62rem;font-weight:500;opacity:.8}
@media (min-width:900px){
  .app{grid-template-columns:252px 1fr}
  .top,.tabs{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:700}
  .side nav a svg{width:20px;height:20px}
  .side nav a .jpn{margin-left:auto;font-size:.72rem;font-weight:500;color:var(--ink-3)}
  .side nav a:hover{background:var(--surface-2)}
  .side nav a.on{background:var(--maple-soft);color:var(--maple)}
  .main{padding-block:32px 48px}
}
.side .goal{margin-top:auto;padding:14px;border-radius:var(--r);background:var(--surface-2);display:flex;gap:12px;align-items:center}

/* Common pieces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;background:var(--maple);color:var(--maple-ink);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--maple);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--maple-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tap{transition:transform .15s,border-color .15s;text-align:left}
.tap:hover{transform:translateY(-2px);border-color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--amber-soft);color:var(--ink)}
.pill.maple{background:var(--maple-soft);color:var(--maple)}
.pill.good{background:var(--good-soft);color:var(--good)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2 .jpn{font-size:.85rem;color:var(--ink-3);margin-left:8px;font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--maple));border-radius:99px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;font-size:.9rem;align-self:flex-start}
.back:hover{color:var(--maple)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px;background:
  radial-gradient(120% 90% at 100% 0%,var(--amber-soft),transparent 60%),
  radial-gradient(90% 80% at 0% 100%,var(--maple-soft),transparent 60%),var(--surface);border:1px solid var(--line);
  display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media (min-width:640px){.hero{grid-template-columns:1fr 190px;padding:32px}}
.hero .owl-big{width:150px;height:150px;justify-self:center;position:relative;z-index:1}
@media (min-width:640px){.hero .owl-big{width:190px;height:190px}}
.hero-text{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;min-width:0}
.hero .greet{font-family:var(--f-display);color:var(--maple);font-size:1.05rem;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaves svg{position:absolute;top:-30px;width:20px;height:20px;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0)}50%{transform:translate(-30px,140px) rotate(160deg)}100%{transform:translate(10px,320px) rotate(320deg);opacity:0}}
.owl-eyes{transform-origin:60px 66px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.owl-bob{animation:bob 4s ease-in-out infinite;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.leaves{display:none}}

/* Feature tiles */
.feat{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.feat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--maple-soft);color:var(--maple)}
.feat .ico svg{width:24px;height:24px}
.feat .ico.am{background:var(--amber-soft);color:var(--amber)}
.feat b{font-size:1.02rem}
.feat .jpn{font-family:var(--f-display);color:var(--ink-3);font-size:.85rem;margin-left:6px}

/* Roadmap */
.road{display:flex;flex-direction:column;gap:0;position:relative}
.stage{display:grid;grid-template-columns:52px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage::before{content:"";position:absolute;left:25px;top:52px;bottom:0;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.stage:last-child::before{display:none}
.stage .badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;background:var(--surface);border:2px solid var(--line);color:var(--ink-2)}
.stage.done .badge{background:var(--maple);border-color:var(--maple);color:var(--maple-ink)}
.stage.cur .badge{border-color:var(--maple);color:var(--maple)}
.stage-body{padding:16px;min-width:0}
.stage-body header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.lessons{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.lrow:hover{background:var(--amber-soft)}
.lrow .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.lrow.ok .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.lrow .chk svg{width:14px;height:14px}
.lrow .t{flex:1;min-width:0}
.lrow .t small{display:block;color:var(--ink-3);font-size:.78rem}

/* Lesson */
.point{padding:20px;display:flex;flex-direction:column;gap:12px}
.pattern{font-size:1.25rem;font-weight:700;color:var(--maple);font-family:var(--f-body);line-height:2}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.ex .jp{font-size:1.2rem}
.ex .tr{color:var(--ink-2);font-size:.9rem;line-height:1.5}
.ex>div{min-width:0;flex:1}
.vtab{width:100%;border-collapse:collapse}
.vtab td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.vtab td:first-child{font-size:1.15rem;font-weight:500;line-height:2.1}
.vtab td:last-child{width:46px}
.tblwrap{overflow-x:auto}
.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kana{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kana b{font-size:clamp(1.4rem,1rem + 2vw,2.2rem);font-weight:500;line-height:1}
.kana small{color:var(--ink-3);font-weight:700;font-size:.78rem}
.kana:hover{border-color:var(--maple);background:var(--maple-soft)}
.kana.empty{visibility:hidden}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:12px;gap:4px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--maple);box-shadow:var(--shadow)}

/* Quiz */
.q{padding:20px;display:flex;flex-direction:column;gap:14px}
.q .stem{font-size:1.2rem;line-height:2.2;font-weight:500}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:1.05rem;line-height:1.9;display:flex;gap:10px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;line-height:1}
.opt:hover{border-color:var(--amber)}
.opt.sel{border-color:var(--maple);background:var(--maple-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts.locked .opt{pointer-events:none}
.expl{padding:14px 16px;border-radius:12px;background:var(--amber-soft);font-size:.95rem;line-height:1.8}
.expl b{color:var(--maple)}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.qnav button.ans{background:var(--amber-soft)}
.qnav button.cur{outline:2px solid var(--maple)}
.qnav button.r{background:var(--good-soft);color:var(--good)}
.qnav button.w{background:var(--bad-soft);color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;color:var(--maple)}
.score-ring{width:140px;height:140px}
.confirm{padding:14px;border-radius:12px;background:var(--maple-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Kaiwa */
.chat{display:flex;flex-direction:column;gap:14px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.bub .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--amber-soft);color:var(--ink)}
.bub .msg{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);min-width:0}
.bub .who{font-size:.72rem;color:var(--ink-3);font-weight:700}
.bub .jp{font-size:1.15rem;line-height:2.1}
.bub .tr{color:var(--ink-2);font-size:.88rem;line-height:1.5}
.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bub.me .msg{border-radius:16px 16px 4px 16px;background:var(--maple-soft);border-color:transparent}
.bub.me .av{background:var(--maple);color:var(--maple-ink)}
.bub.playing .msg{outline:2px solid var(--amber)}
.bub .iconbtn{width:32px;height:32px}
.pop{animation:pop .3s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface-2);border-radius:0 12px 12px 0;font-size:.92rem;line-height:1.8}

/* Games */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px}
.mcard{aspect-ratio:3/4;border-radius:14px;background:var(--maple);color:var(--maple-ink);display:grid;place-items:center;font-size:1.6rem;font-weight:700;position:relative}
.mcard.back-face::after{content:"";width:40%;height:40%;background:currentColor;opacity:.25;-webkit-mask:var(--leaf) center/contain no-repeat;mask:var(--leaf) center/contain no-repeat}
.mcard.up{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.mcard.got{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.flash{min-height:240px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;width:100%}
.flash .big{font-size:2rem;line-height:2.2;font-weight:500}
.slots{min-height:64px;padding:12px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:1.1rem;line-height:2;font-weight:500}
.tok:hover{border-color:var(--maple)}
.tok.used{visibility:hidden}
.bigkana{font-size:4.5rem;line-height:1;font-weight:500;text-align:center;padding:24px 0}

/* Profile */
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.weekbars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekbars i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--amber);min-height:3px}
.weekbars .today i{background:var(--maple)}
.weekbars small{font-size:.72rem;color:var(--ink-3);font-weight:700}
.weekbars span{font-size:.7rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{padding:14px 10px;text-align:center;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.55}
.bdg.on{opacity:1;background:var(--amber-soft)}
.bdg .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-display);font-weight:800;color:var(--ink-3);font-size:1.1rem}
.bdg.on .medal{background:var(--maple);color:var(--maple-ink)}
.bdg b{font-size:.85rem}.bdg small{font-size:.72rem;color:var(--ink-2);line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.88rem}

 {k:'h',p:'Lingkungan · obrolan dengan tetangga',sp:['鈴木{すずき}','アンディ'],l:[

9:[{k:'k',p:'Pabrik · tidak mengerti instruksi',sp:['田中{たなか}','アンディ'],l:[

 {k:'h',p:'Asrama · bicara soal hobi',sp:['リナ','アンディ'],l:[

 [0,'じゃ、 今晩{こんばん} カラオケへ 行{い}きませんか。','Kalau begitu, nanti malam mau ke karaoke?'],

10:[{k:'k',p:'Gudang · mencari barang',sp:['アンディ','田中{たなか}'],l:[

 [1,'ええ、 青{あお}い 箱{はこ}の 中{なか}です。','Ya, di dalam kotak biru.'],
 [0,'それから、 山田{やまだ}さん*は どこに いますか*。','Lalu, Pak Yamada ada di mana?'],

 {k:'h',p:'Jalan · mencari konbini',sp:['アンディ','おばあさん'],l:[
 [0,'すみません。 この 近{ちか}く*に* コンビニ*が ありますか*。','Permisi. Di dekat sini ada konbini?'],

11:[{k:'k',p:'Gudang · menyiapkan barang',sp:['田中{たなか}','アンディ'],l:[
 [0,'アンディさん、 箱{はこ}を *三{みっ}つ* お願{ねが}いします。','Andi, tolong kotaknya tiga.'],
 [1,'はい。 マスクも いりますか。','Baik. Masker juga perlu?'],
 [0,'ええ、 マスクを *五枚{ごまい}* お願{ねが}いします。','Ya, masker lima lembar.'],
 [1,'わかりました。 箱{はこ}*三{みっ}つ*と マスク*五枚{ごまい}*ですね。','Baik. Kotak tiga dan masker lima lembar ya.'],
 [0,'はい、 そうです。','Ya, betul.']],

 {k:'h',p:'Asrama · bercerita tentang keluarga',sp:['鈴木{すずき}','アンディ'],l:[
 [0,'ご家族{かぞく}は *何人{なんにん}*ですか。','Keluarga Anda berapa orang?'],
 [1,'*五人{ごにん}*です。 弟{おとうと}が *二人{ふたり}* います。','Lima orang. Saya punya dua adik laki-laki.'],

 [1,'*3年{さんねん}*です。','3 tahun.'],
 [0,'日本語{にほんご}は *どのくらい* 勉強{べんきょう}しましたか。','Berapa lama belajar bahasa Jepang?'],

 tip:'ご家族{かぞく} adalah bentuk hormat untuk keluarga orang lain. Untuk keluarga sendiri cukup 家族{かぞく}.'}],
12:[{k:'k',p:'Pabrik · setelah shift malam',sp:['田中{たなか}','アンディ'],l:[
 [0,'きのうの 夜勤{やきん}は どう*でしたか*。','Shift malam kemarin bagaimana?'],

 {k:'h',p:'Kafe · cerita perjalanan',sp:['リナ','アンディ'],l:[

 [1,'とても *楽{たの}しかったです*。 でも、 天気{てんき}は あまり *よくなかったです*。','Sangat menyenangkan. Tapi cuacanya kurang bagus.'],
 [0,'京都{きょうと}と 大阪{おおさか}と *どちらが* 好{す}きですか。','Lebih suka Kyoto atau Osaka?'],

 {k:'h',p:'Stasiun · lapar sepulang kerja',sp:['リナ','アンディ'],l:[

14:[{k:'k',p:'Pabrik · menerima instruksi',sp:['田中{たなか}','アンディ'],l:[
 [0,'アンディさん、 ちょっと *来{き}て ください*。','Andi, tolong ke sini sebentar.'],

15:[{k:'k',p:'Pabrik · menanyakan aturan',sp:['アンディ','田中{たなか}'],l:[

 {k:'h',p:'Lingkungan · saling mengenal',sp:['鈴木{すずき}','アンディ'],l:[

16:[{k:'k',p:'Pabrik · urutan kerja',sp:['田中{たなか}','アンディ'],l:[

17:[{k:'k',p:'Konstruksi · aturan keselamatan',sp:['田中{たなか}','アンディ'],l:[

18:[{k:'k',p:'Wawancara kerja · menyebut kemampuan',sp:['面接官{めんせつかん}','アンディ'],l:[

 {k:'h',p:'Asrama · rutinitas malam',sp:['リナ','アンディ'],l:[

19:[{k:'k',p:'Pabrik · mesin baru',sp:['田中{たなか}','アンディ'],l:[

20:[{k:'k',p:'Pabrik · ngobrol dengan rekan sebaya',sp:['ブディ','アンディ'],l:[

<script>
/* ===================== STATE ===================== */
const KEY='owl-nihongo-v1';
const DEF=()=>({name:'',xp:0,streak:0,last:null,days:{},done:{},kaiwa:{},best:{},stars:{},tryouts:[],badges:{},set:{furi:true,fs:'l',tr:true,rate:.9}});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r)return Object.assign(DEF(),r,{set:Object.assign(DEF().set,r.set||{})})}catch(e){}return DEF()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const UI={route:'beranda',lvTab:null,lesson:null,lq:{},kaiwa:null,kmode:'dengar',rp:null,quiz:null,pf:{lv:'all',cat:'all'},game:null,reset:false,rev:null,confirmSubmit:false};
let timers=[];
function stopTimers(){timers.forEach(clearInterval);timers=[];try{speechSynthesis.cancel()}catch(e){}}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const RB=/([々〆ヶ一-鿿0-9０-９]+)\{([^}]+)\}/g;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rb=t=>esc(t).replace(RB,'<ruby>$1<rt>$2</rt></ruby>');
const rbh=t=>String(t).replace(RB,'<ruby>$1<rt>$2</rt></ruby>');
const kana=t=>String(t).replace(RB,'$2').replace(/[\s　]/g,'');
const ic=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=(t,label='Dengarkan')=>`<button class="iconbtn" data-say="${esc(t)}" aria-label="${label}">${ic('play')}</button>`;
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const GOAL=60;
const todayXP=()=>S.days[dk(Date.now())]||0;
const curStreak=()=>{const t=dk(Date.now()),y=dk(Date.now()-864e5);return(S.last===t||S.last===y)?S.streak:0};
const allLessons=()=>LEVELS.flatMap(l=>l.lessons.map(x=>Object.assign({lv:l},x)));
const findLesson=id=>allLessons().find(x=>x.id===id);
const allVocab=()=>LEVELS.flatMap(l=>l.lessons.flatMap(x=>x.vocab||[]));
function rank(){let r=RANKS[0],nx=RANKS[1];RANKS.forEach((k,i)=>{if(S.xp>=k[0]){r=k;nx=RANKS[i+1]||null}});return{r,nx}}
function ring(p,s=56,label=''){p=Math.max(0,Math.min(1,p));const r=s/2-6,c=2*Math.PI*r;
 return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex:none" aria-hidden="true"><circle cx="${s/2}" cy="${s/2}" r="${r}" style="fill:none;stroke:var(--line)" stroke-width="7"/><circle cx="${s/2}" cy="${s/2}" r="${r}" style="fill:none;stroke:var(--maple)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})"/>${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink);font-weight:800;font-size:${Math.round(s/4.6)}px;font-family:var(--f-body)">${label}</text>`:''}</svg>`}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ===================== SUARA ===================== */
const FK=new Set(["一人|ひとり", "一日|いちにち", "七|なな", "七人|ななにん", "上|あ", "上|うえ", "上手|じょうず", "下|した", "下手|へた", "中|なか", "九|ここの", "九人|きゅうにん", "二人|ににん", "二人|ふたり", "人|じん", "人|にん", "人|ひと", "今日|きょう", "何|なに", "何|なん", "何時|なんじ", "作業靴|さぎょうぐつ", "入|い", "入|はい", "八|やっ", "六|むっ", "六|ろっ", "出|だ", "出|で", "分|ふん", "分|わ", "前|まえ", "十|とお", "四|し", "四|よっ", "四|よん", "四人|よにん", "回|かい", "回|まわ", "土産|みやげ", "報連相|ほうれんそう", "変|か", "変|へん", "外国人|がいこくじん", "安|やす", "安全靴|あんぜんぐつ", "富士山|ふじさん", "少|すく", "少|すこ", "広|ひろ", "弾|ひ", "形|けい", "後|うし", "御社|おんしゃ", "急|いそ", "急|きゅう", "方|かた", "明日|あした", "昨日|きのう", "時計|とけい", "普通形|ふつうけい", "書|か", "枚|まい", "果物|くだもの", "止|と", "歳|さい", "母|かあ", "母|はは", "眼鏡|めがね", "着|き", "着|つ", "行|い", "触|さわ", "言|い", "話|はな", "話|はなし", "読|よ", "買|か", "車|くるま", "遅|おく", "遅|おそ", "部屋|へや", "開|あ", "間|あいだ", "間|ま", "降|お", "降|ふ", "非常口|ひじょうぐち", "飲|の"]);
const spk=t=>{t=String(t).replace(/\*/g,'').replace(/（\s*）/g,'');const one=t.replace(/[〜～\s　]/g,'');const m=one.match(/^([々〆ヶ一-鿿0-9０-９]+)\{([^}]+)\}$/);if(m)return m[2];return t.replace(RB,(x,b,r)=>FK.has(b+'|'+r)?r:b).replace(/[〜～\s　]/g,'')};
let jaVoice=null,jaVoices=[];
const vScore=x=>(/natural|neural|online/i.test(x.name)?50:0)+(/google/i.test(x.name)?40:0)+(/nanami|keita|kyoko|o-ren|otoya|hattori/i.test(x.name)?30:0)+(/premium|enhanced|拡張/i.test(x.name)?15:0)+(/haruka|ayumi|ichiro|sayaka/i.test(x.name)?5:0);
const vName=x=>x.name.replace(/Microsoft|Google|Online|\(Natural\)|Natural|- Japanese \(Japan\)|Japanese|\(Japan\)|日本語/gi,'').replace(/[()]/g,'').trim()||x.name;
function pickVoice(){try{jaVoices=speechSynthesis.getVoices().filter(x=>/^ja/i.test(x.lang)||/ja[-_]JP/i.test(x.lang)).sort((a,b)=>vScore(b)-vScore(a));const want=S.set&&S.set.voice;jaVoice=(want&&jaVoices.find(x=>x.name===want))||jaVoices[0]||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,onend){
 if(!('speechSynthesis' in window)){toast('Suara belum didukung di perangkat ini');onend&&onend();return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spk(t));u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=S.set.rate;if(speak.p)u.pitch=speak.p;
 let fired=false;const fin=()=>{if(!fired){fired=true;onend&&onend()}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
 if(!jaVoice&&!speak.warned){speak.warned=true;setTimeout(()=>{pickVoice();if(!jaVoice)toast('Tip: pasang suara bahasa Jepang di pengaturan perangkat agar pelafalan lebih jelas')},600)}
}

/* ===================== XP & LENCANA ===================== */
function addXP(n,why){if(n<=0)return;const t=dk(Date.now());
 if(S.last!==t){S.streak=S.last===dk(Date.now()-864e5)?S.streak+1:1;S.last=t}
 S.xp+=n;S.days[t]=(S.days[t]||0)+n;checkBadges();save();toast(`+${n} XP · ${why}`);paintChrome()}
function checkBadges(){const B=S.badges;const give=k=>{if(!B[k]){B[k]=dk(Date.now());const b=BADGES.find(x=>x[0]===k);setTimeout(()=>toast('Lencana baru: '+b[2]),2600)}};
 if(Object.keys(S.done).length>=1)give('first');if((S.best.kilat||0)>=15||(S.best['c-vq-kana']||0)>=15)give('kana');if(Object.keys(S.kaiwa).length>=3)give('kaiwa');
 if(S.tryouts.some(t=>t.pct>=80))give('pass');if(S.streak>=3)give('streak3');if(S.xp>=500)give('xp500');
 if(LEVELS.find(l=>l.id==='biz').lessons.every(x=>S.done[x.id]))give('biz');if(LEVELS.find(l=>l.id==='n1').lessons.every(x=>S.done[x.id]))give('n1');if(allLessons().every(x=>S.done[x.id]))give('all')}

/* ===================== KERANGKA ===================== */
const NAV=[['beranda','Beranda','ホーム','home'],['belajar','Belajar','学習','book'],['bisnis','Bisnis','ビジネス','brief'],['kaiwa','Kaiwa','会話','chat'],['soal','Soal','問題','pen'],['game','Game','ゲーム','game'],['profil','Profil','マイページ','user']];
function paintChrome(){
 $('#sidenav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${UI.route===n[0]?'on':''}">${ic(n[3])}<span>${n[1]}</span><span class="jpn">${n[2]}</span></a>`).join('');
 $('#tabs').innerHTML=NAV.slice(0,6).map(n=>`<a href="#${n[0]}" class="${UI.route===n[0]?'on':''}">${ic(n[3])}<span>${n[1]}</span><span class="jpn">${n[2]}</span></a>`).join('');
 $('#topstats').innerHTML=`<span class="chip-stat" title="Hari beruntun">${ic('fire')}<span class="num">${curStreak()}</span></span><span class="chip-stat num">${S.xp} XP</span><a class="iconbtn" href="#profil" aria-label="Profil">${ic('user')}</a>`;
 $('#sidegoal').innerHTML=ring(todayXP()/GOAL,50)+`<div style="min-width:0"><b style="font-size:.9rem">Target harian</b><div class="muted num" style="font-size:.82rem">${Math.min(todayXP(),GOAL)}/${GOAL} XP · ${curStreak()} hari beruntun</div></div>`;

function fixBubbles(){document.querySelectorAll('.scene-art').forEach(a=>{const A=a.getBoundingClientRect(),bs=[...a.querySelectorAll('.sb')],placed=[];
 bs.forEach(b=>{b.style.setProperty('--dx','0px');b.style.setProperty('--dy','0px')});
 bs.forEach(b=>{const r=b.getBoundingClientRect();let dx=0,dy=0;if(r.left<A.left+4)dx=A.left+4-r.left;else if(r.right>A.right-4)dx=A.right-4-r.right;
  const q={l:r.left+dx,r:r.right+dx,t:r.top,b:r.bottom};let moved=true,guard=0;
  while(moved&&guard++<6){moved=false;for(const p of placed)if(q.l<p.r+2&&p.l<q.r+2&&q.t<p.b+2&&p.t<q.b+2){const s=q.b-p.t+4;dy-=s;q.t-=s;q.b-=s;moved=true}}

function vqQ(g){const P=g.pool;let k;do{k=Math.floor(Math.random()*P.length)}while(P.length>1&&g.q&&P[k][0]===g.q.w);

 startTryout:d=>{const t=TRYOUTS.find(x=>x.id===d.id);const ids=shuffle(QB.map((q,i)=>i).filter(i=>t.lv.includes(QB[i][0]))).slice(0,t.n);startQuiz('tryout',ids,t.title,t.id,t.min)},
 qPick:d=>{const Q=UI.quiz;if(Q.done)return;if(Q.mode==='latihan'&&Q.ans[Q.i]!==undefined)return;Q.ans[Q.i]=+d.o;UI.confirmSubmit=false;rerender()},
 qNext:()=>{UI.quiz.i=Math.min(UI.quiz.i+1,UI.quiz.qs.length-1);UI.confirmSubmit=false;rerender()},
 qPrev:()=>{UI.quiz.i=Math.max(0,UI.quiz.i-1);UI.confirmSubmit=false;rerender()},
 qGo:d=>{UI.quiz.i=+d.i;UI.confirmSubmit=false;rerender()},
 askSubmit:()=>{UI.confirmSubmit=true;rerender()},cancelSubmit:()=>{UI.confirmSubmit=false;rerender()},
 finish:()=>finishQuiz(),
 rev:d=>{UI.rev=UI.rev===+d.i?null:+d.i;rerender()},
 retryQuiz:()=>{const Q=UI.quiz;const t=Q.tid&&TRYOUTS.find(x=>x.id===Q.tid);if(t)ACT.startTryout({id:t.id});else startQuiz('latihan',shuffle(Q.qs.map(q=>q.k)),Q.title,null,0)},
 exitQuiz:()=>openSub(()=>{UI.quiz=null}),
 gLv:d=>{UI.gLv=d.id;rerender()},
 startGame:d=>openSub(()=>{UI.game=initGame(d.g,d.lv||UI.gLv||'n5')}),
 exitGame:()=>openSub(()=>{UI.game=null}),
 gStart:()=>UI.game.t==='fc'?fcStart(UI.game):gRun(UI.game),
 fcDir:d=>{UI.game.dir=d.v;rerender()},
 fcSize:d=>{UI.game.size=+d.v;rerender()},
 fcBab:d=>{const g=UI.game;g.bab=+d.v;const n=fcFiltered(g).length;g.size=n>10?10:0;rerender()},
 fcFlip:()=>{const g=UI.game;if(fcSuppress||!g||g.busy||!g.run)return;g.flip=!g.flip;const c=document.querySelector('.fc-card');if(c)c.classList.toggle('flip',g.flip);if(g.flip)speak(g.deck[g.queue[0]][0])},
 fcHint:()=>{UI.game.hint=true;rerender()},
 fcAns:d=>fcAnswer(d.v==='1'),
 gAns:(d,el)=>{const g=UI.game;if(!g||!g.run||g.lock)return;g.lock=true;const next=()=>{if(UI.game===g&&g.run){(g.t==='km'?kmQ:vqQ)(g);rerender()}};
  if(+d.o===g.q.a){g.correct++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);const m=Math.min(4,1+Math.floor(g.combo/3));g.score+=10*m;g.fb=g.combo>=3?'すごい！':'正解！';el.classList.add('right');setTimeout(next,220)}
  else{g.combo=0;g.fb='おしい！';el.classList.add('wrong','shake');const r=document.querySelector(`[data-act="gAns"][data-o="${g.q.a}"]`);r&&r.classList.add('right');setTimeout(next,700)}},
 pmFlip:d=>{const g=UI.game,i=+d.i;if(g.busy||g.fin||g.open.includes(i)||g.got.includes(i))return;g.open.push(i);
  if(g.open.length===2){g.moves++;const[a,b]=g.open;if(g.cards[a].id===g.cards[b].id){g.got.push(a,b);g.open=[];const w=g.cards[a].jp?g.cards[a]:g.cards[b];speak(w.f)}else{g.busy=true;setTimeout(()=>{g.open=[];g.busy=false;if(UI.game===g)rerender()},800)}}rerender()},
 gcPick:d=>{const g=UI.game;if(g.ans!==null)return;g.ans=+d.o;const q=g.qs[g.i];if(q.p[g.ans]===q.a)g.correct++;else g.lives--;rerender()},
 gcNext:()=>{const g=UI.game;if(g.lives===0||g.i===g.qs.length-1){const r=g.correct/g.qs.length;gFinish(g,r>=.9?3:r>=.7?2:r>=.4?1:0,g.correct*10,gd(g.t,g.lv).name)}else{g.i++;g.ans=null;render();window.scrollTo(0,0)}},
 sAdd:d=>{const g=UI.game,t=+d.t;if(!g.pick.includes(t)){g.pick.push(t);rerender()}},
 sDel:d=>{UI.game.pick.splice(+d.i,1);rerender()},
 sClear:()=>{UI.game.pick=[];rerender()},
 sCheck:()=>{const g=UI.game,T=g.sents[g.i][0];const ok=g.pick.map(i=>T[i]).join('')===T.join('');g.res=ok?'ok':'no';if(ok){g.correct++;speak(T.join(''))}rerender()},
 sNext:()=>{const g=UI.game,n=g.sents.length;if(g.i===n-1){const c=g.correct;gFinish(g,c===n?3:c>=Math.ceil(n*.6)?2:c>=1?1:0,c*20,gd(g.t,g.lv).name)}else{g.i++;g.pick=[];g.bank=null;g.res=null;rerender()}},
 setT:d=>{S.set[d.k]=!S.set[d.k];save();rerender()},
 setV:d=>{S.set[d.k]=d.k==='rate'?+d.v:d.v;save();rerender()},
 voiceSel:d=>{S.set.voice=d.v;pickVoice();save();rerender();speak('はじめまして。 日本語{にほんご}を 勉強{べんきょう}しましょう。')},
 resetAsk:()=>{UI.reset=true;rerender()},resetNo:()=>{UI.reset=false;rerender()},
 resetYes:()=>{const set=S.set,name=S.name;S=DEF();S.set=set;S.name=name;save();UI.reset=false;toast('Progres sudah diatur ulang');render()}
};
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s){e.preventDefault();speak(s.dataset.say);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a.dataset,a)}});
document.addEventListener('change',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim().slice(0,24);save();toast('Nama disimpan')}});
window.addEventListener('hashchange',go);
document.addEventListener('pointerdown',e=>{const sc=e.target.closest('.fc-scene');if(!sc||e.target.closest('button'))return;fcDrag={x:e.clientX,dx:0,sc,moved:false}});
document.addEventListener('pointermove',e=>{if(!fcDrag)return;const dx=e.clientX-fcDrag.x;fcDrag.dx=dx;if(Math.abs(dx)>8){fcDrag.moved=true;const s=fcDrag.sc;s.classList.add('drag');s.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;s.style.setProperty('--r',Math.max(0,Math.min(1,dx/110)));s.style.setProperty('--l',Math.max(0,Math.min(1,-dx/110)))}});
document.addEventListener('pointerup',()=>{if(!fcDrag)return;const d=fcDrag;fcDrag=null;if(!d.moved)return;fcSuppress=true;setTimeout(()=>{fcSuppress=false},60);
 if(d.dx>100)fcAnswer(true);else if(d.dx<-100)fcAnswer(false);else{d.sc.classList.remove('drag');d.sc.style.transform='';d.sc.style.setProperty('--r',0);d.sc.style.setProperty('--l',0)}});
document.addEventListener('pointercancel',()=>{if(fcDrag){fcDrag.sc.classList.remove('drag');fcDrag.sc.style.transform='';fcDrag=null}});
document.addEventListener('keydown',e=>{const g=UI.game;if(!g||g.t!=='fc'||!g.run||g.over)return;if(e.target.closest&&e.target.closest('input,textarea,select'))return;
 if(e.key==='ArrowRight'){e.preventDefault();fcAnswer(true)}else if(e.key==='ArrowLeft'){e.preventDefault();fcAnswer(false)}
 else if((e.key===' '||e.key==='Enter')&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();ACT.fcFlip()}});
go();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
